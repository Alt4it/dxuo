<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>社会科 用語トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --paper:#eae6da; --panel:#ffffff; --panel-2:#f4f1e8; --panel-3:#e7e1d3;
    --ink:#1e1a13; --ink-soft:#50493d; --ink-faint:#857d6e;
    --line:#cbc3af; --line-soft:#ded7c6;
    --pol:#294b73; --eco:#9a7016; --cul:#664388; --war:#9e3326; --wld:#2d6f63;
    --ok:#2f8f52; --ok-bg:#e3f3e7; --bad:#c23d2b; --bad-bg:#f8e4df;
    --gold:#cf9a2e; --heart:#d8433a;
    --accent:#294b73;
    --shadow:0 1px 2px rgba(40,34,22,.10),0 4px 14px rgba(40,34,22,.07);
    --shadow-lift:0 4px 10px rgba(40,34,22,.16),0 14px 30px rgba(40,34,22,.14);
    --serif:"Shippori Mincho B1",'Hiragino Mincho ProN','Yu Mincho',serif;
    --sans:"Zen Kaku Gothic New",'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14161b; --panel:#1c1f26; --panel-2:#242833; --panel-3:#2c3140;
      --ink:#eae6dc; --ink-soft:#b0a99b; --ink-faint:#807869;
      --line:#333844; --line-soft:#282c36;
      --pol:#89b0de; --eco:#dcaa58; --cul:#bf9ad9; --war:#e89883; --wld:#79ccc7;
      --ok:#5bc27e; --ok-bg:#1d3326; --bad:#e8897b; --bad-bg:#37221e;
      --gold:#e6b94e; --heart:#ef6b60; --accent:#89b0de;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
      --shadow-lift:0 4px 10px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

  /* ===== status bar ===== */
  .status{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
  .stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px}
  .stat .ic{font-size:16px}
  .stat.lv{background:var(--pol);color:#fff;padding:4px 11px;border-radius:999px;font-size:12.5px}
  .stat.xp{color:var(--eco)} .stat.streak{color:var(--war)} .stat.heart{color:var(--heart);margin-left:auto}

  .screen{flex:1;display:flex;flex-direction:column;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
  .hidden{display:none !important}

  /* ===== home ===== */
  h1{font-family:var(--serif);font-weight:800;font-size:23px;margin:4px 0 2px}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:14px}
  .ctabs{display:flex;gap:8px;margin-bottom:6px}
  .ctab{flex:1;font-family:var(--sans);font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:10px;border-radius:12px;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:3px}
  .ctab .ce{font-size:19px}
  .ctab[aria-selected="true"]{border-color:transparent;color:#fff}
  .ctab.c-rekishi[aria-selected="true"]{background:var(--war)}
  .ctab.c-chiri[aria-selected="true"]{background:var(--wld)}
  .ctab.c-komin[aria-selected="true"]{background:var(--pol)}
  .ctab .cs{font-size:10.5px;font-weight:600;opacity:.8}

  .unit{margin-top:18px}
  .unit .uh{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
  .unit .uh .un{font-family:var(--serif);font-weight:800;font-size:17px}
  .unit .uh .up{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-faint)}
  .ubar{height:9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-soft);overflow:hidden;margin-bottom:16px}
  .ubar>i{display:block;height:100%;width:0;background:var(--eco);transition:width .4s}

  .path{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
  .node{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:3px 0}
  .node .ring{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:var(--shadow);border:3px solid var(--panel);transition:transform .12s}
  .node:active .ring{transform:translateY(2px)}
  .node .lbl{font-weight:700;font-size:13px;margin-top:5px;color:var(--ink-soft)}
  .node .crown{position:absolute;top:-6px;right:50%;transform:translateX(34px);font-size:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
  .node.done .ring{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--eco),var(--shadow)}
  .connector{width:5px;height:26px;background:var(--line);border-radius:3px;margin:2px 0}
  .node.cur .ring{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}50%{box-shadow:0 0 0 9px transparent,var(--shadow)}}

  /* 時代の目次 */
  .unitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  @media (max-width:380px){ .unitgrid{grid-template-columns:1fr} }
  .ucard{text-align:left;border:1px solid var(--line);border-left-width:5px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:13px 14px;cursor:pointer;transition:transform .12s,box-shadow .14s;display:flex;flex-direction:column;gap:7px;font-family:var(--sans)}
  .ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .ucard:active{transform:translateY(0)}
  .ucard .un{font-family:var(--serif);font-weight:800;font-size:16.5px;color:var(--ink)}
  .ucard .umeta{font-size:11.5px;font-weight:700;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
  .ucard .ubar2{height:7px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-soft)}
  .ucard .ubar2>i{display:block;height:100%;width:0;border-radius:999px}
  .ucard.cleared{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--eco),var(--shadow)}
  .backbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:8px 13px;border-radius:999px;cursor:pointer;margin:6px 0 2px;transition:all .14s}
  .backbtn:hover{border-color:var(--ink-faint);color:var(--ink)}

  .foot{margin-top:26px;text-align:center;color:var(--ink-faint);font-size:11.5px;line-height:1.7}
  .soonbox{margin-top:24px;border:1px dashed var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--ink-soft);background:var(--panel)}
  .soonbox b{font-family:var(--serif)}

  /* ===== lesson ===== */
  .lhead{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
  .xbtn{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-faint);background:var(--panel);border:1px solid var(--line);border-radius:999px;cursor:pointer;line-height:1;flex:none;padding:7px 12px;white-space:nowrap;transition:all .14s}
  .xbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
  /* 確認バー */
  .qbar{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(120%);transition:transform .26s cubic-bezier(.2,.8,.3,1)}
  .qbar.show{transform:translateY(0)}
  .qbar-in{max-width:520px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(40,34,22,.16);border-top-left-radius:18px;border-top-right-radius:18px;padding:16px 18px calc(16px + env(safe-area-inset-bottom))}
  .qbar-t{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink)}
  .qbar-t span{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--ink-faint);margin-top:3px}
  .qbar-btns{display:flex;gap:10px;margin-top:13px}
  .qb{flex:1;border-radius:13px;padding:13px;font-family:var(--sans);font-weight:800;font-size:15px;cursor:pointer;border:1.5px solid var(--line);border-bottom-width:3px;transition:transform .08s}
  .qb:active{transform:translateY(1px)}
  .qb.cancel{background:var(--panel);color:var(--ink-soft)}
  .qb.leave{background:var(--bad);color:#fff;border-color:var(--bad)}
  .qbackdrop{position:fixed;inset:0;z-index:49;background:rgba(20,16,10,.28);opacity:0;pointer-events:none;transition:opacity .2s}
  .qbackdrop.show{opacity:1;pointer-events:auto}
  .pbar{flex:1;height:14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-soft);overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .3s}
  .lhearts{flex:none;font-weight:800;color:var(--heart);font-size:14px;display:inline-flex;align-items:center;gap:3px}

  .qwrap{padding:8px 18px 0;flex:1;display:flex;flex-direction:column}
  .qkind{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:6px 0 10px}
  .qprompt{font-family:var(--serif);font-weight:800;line-height:1.4}
  .qprompt.term{font-size:clamp(24px,7vw,32px)}
  .qprompt.mean{font-size:clamp(16px,4.6vw,20px);line-height:1.6;font-weight:700}
  .qhint{font-size:12.5px;color:var(--ink-faint);margin-top:8px}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .choice{text-align:left;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--panel);color:var(--ink);border-radius:14px;padding:14px 15px;font-family:var(--sans);font-size:15px;font-weight:600;line-height:1.5;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
  .choice:active{transform:translateY(1px)}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .choice.disabled{pointer-events:none;opacity:.6}
  .choice.disabled.correct,.choice.disabled.wrong{opacity:1}

  /* feedback sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
  .sheet.show{transform:translateY(0)}
  .sheet-in{max-width:520px;margin:0 auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top-left-radius:20px;border-top-right-radius:20px}
  .sheet.ok .sheet-in{background:var(--ok-bg)}
  .sheet.bad .sheet-in{background:var(--bad-bg)}
  .sheet .fh{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:800;font-size:18px}
  .sheet.ok .fh{color:var(--ok)} .sheet.bad .fh{color:var(--bad)}
  .sheet .ans{margin-top:7px;font-size:14px;color:var(--ink);line-height:1.6}
  .sheet .ans b{font-family:var(--serif)}
  .contbtn{width:100%;margin-top:14px;border:none;border-radius:14px;padding:15px;font-family:var(--sans);font-weight:800;font-size:16px;color:#fff;cursor:pointer;border-bottom:3px solid rgba(0,0,0,.18)}
  .sheet.ok .contbtn{background:var(--ok)} .sheet.bad .contbtn{background:var(--bad)}

  /* ===== result ===== */
  .result{padding:30px 20px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
  .result .big{font-size:60px;margin-bottom:4px}
  .result h2{font-family:var(--serif);font-weight:800;font-size:24px}
  .result .rsub{color:var(--ink-soft);font-size:14px;margin-top:2px}
  .rstats{display:flex;gap:10px;margin:22px 0 6px;width:100%}
  .rstat{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 8px;box-shadow:var(--shadow)}
  .rstat .rv{font-family:var(--serif);font-weight:800;font-size:22px}
  .rstat .rl{font-size:11px;color:var(--ink-faint);font-weight:700;margin-top:2px}
  .rstat.xp .rv{color:var(--eco)} .rstat.acc .rv{color:var(--ok)} .rstat.streak .rv{color:var(--war)}
  .levelup{margin-top:16px;background:var(--pol);color:#fff;border-radius:14px;padding:12px;font-weight:800;font-size:15px;width:100%}
  .rbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:22px}
  .rbtn{border:none;border-radius:14px;padding:15px;font-family:var(--sans);font-weight:800;font-size:16px;cursor:pointer;border-bottom:3px solid rgba(0,0,0,.18)}
  .rbtn.primary{background:var(--ok);color:#fff}
  .rbtn.ghost{background:var(--panel);color:var(--ink-soft);border:1.5px solid var(--line);border-bottom-width:3px}
</style>
</head>
<body>
<div class="app">
  <!-- status -->
  <div class="status" id="status">
    <span class="stat lv" id="sLv">Lv.1</span>
    <span class="stat streak"><span class="ic">🔥</span><span id="sStreak">0</span></span>
    <span class="stat xp"><span class="ic">⭐</span><span id="sXp">0</span></span>
    <span class="stat heart"><span class="ic">❤️</span><span id="sHeart">5</span></span>
  </div>

  <!-- HOME -->
  <section class="screen" id="homeScreen">
    <h1>社会科 用語トレーニング</h1>
    <p class="sub">毎日の積み重ねで、用語を「見て・選んで」定着させよう。</p>
    <div class="ctabs" id="ctabs"></div>
    <div id="courseBody"></div>
    <p class="foot">中学社会（高校入試）。歴史・公民は既存教材の用語、地理は範囲を決めて追加していきます。</p>
  </section>

  <!-- LESSON -->
  <section class="screen hidden" id="lessonScreen" style="padding:0">
    <div class="lhead">
      <button class="xbtn" id="quitBtn">途中でやめる</button>
      <div class="pbar"><i id="pfill"></i></div>
      <span class="lhearts"><span>❤️</span><span id="lHeart">5</span></span>
    </div>
    <div class="qwrap" id="qwrap"></div>
  </section>

  <!-- RESULT -->
  <section class="screen hidden" id="resultScreen"></section>
</div>

<!-- feedback sheet -->
<!-- 途中でやめる 確認バー -->
<div class="qbackdrop" id="qbackdrop"></div>
<div class="qbar" id="quitbar">
  <div class="qbar-in">
    <div class="qbar-t">レッスンをやめますか？<span>この回の記録は保存されません。</span></div>
    <div class="qbar-btns">
      <button class="qb cancel" id="quitCancel">つづける</button>
      <button class="qb leave" id="quitOk">やめる</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="fh" id="fh"></div>
    <div class="ans" id="fans"></div>
    <button class="contbtn" id="contBtn">つづける</button>
  </div>
</div>

<script>
const RAW_REKISHI = {"kamakura": [{"t": "東大寺の焼失（平氏の焼き打ち）", "m": "平氏の焼き打ちで東大寺が焼けたこと", "d": "平氏の焼き打ちにより、東大寺の大仏や建物が焼け落ちた。", "ax": "war", "y": 1180, "w": "東大寺の焼失", "q": "平氏の焼き打ちによって東大寺の大仏や建物が焼けたできごとを何というか。"}, {"t": "守護・地頭の設置", "m": "国ごとに守護、荘園・公領ごとに地頭を置いたこと", "d": "源頼朝が国ごとに守護、荘園・公領ごとに地頭を置き、全国支配の土台をつくる。事実上の鎌倉幕府の成立とされる。", "ax": "pol", "y": 1185, "cf": [{"t": "国司", "m": "律令制で国を治めた地方の役人"}, {"t": "守護大名", "m": "室町時代に領国を支配した守護"}], "w": "守護・地頭", "q": "源頼朝が国ごとに置いた軍事・警察の役職と、荘園や公領ごとに置いた役職をまとめて何というか。"}, {"t": "頼朝、征夷大将軍になる", "m": "源頼朝が武家政権の長に正式に任命されたこと", "d": "武家政権の頂点として正式に任命される。", "ax": "pol", "y": 1192, "cf": [{"t": "坂上田村麻呂", "m": "平安初期、蝦夷を討った征夷大将軍"}], "w": "征夷大将軍", "q": "1192年に源頼朝が任じられた、武家政権の長の地位を何というか。"}, {"t": "源頼朝の死（北条氏の台頭）", "m": "頼朝の死後、北条氏が力を伸ばし始めたこと", "d": "頼朝の死後、将軍を補佐する北条氏がしだいに力を伸ばしていく。", "ax": "pol", "y": 1199, "w": "北条氏", "q": "源頼朝の死後、将軍を補佐しながら力を伸ばした一族を何というか。"}, {"t": "北条氏の執権政治が始まる", "m": "北条氏が執権として政治の実権をにぎったこと", "d": "北条時政が執権となり、将軍を補佐する立場で政治の実権をにぎる。", "ax": "pol", "y": 1203, "cf": [{"t": "摂関政治", "m": "藤原氏が摂政・関白として行った政治"}, {"t": "管領", "m": "室町幕府で将軍を補佐した役職"}], "w": "執権政治", "q": "北条氏が執権の地位について政治の実権をにぎった政治を何というか。"}, {"t": "六波羅探題の設置", "m": "幕府が京都に置いた、朝廷と西国の監視機関", "d": "承久の乱に勝った幕府が京都に置き、朝廷と西国の武士を監視した。", "ax": "pol", "y": 1221, "cf": [{"t": "京都所司代", "m": "江戸幕府が京都に置いた監視の役所"}, {"t": "大宰府", "m": "古代、九州に置かれた外交・防衛の役所"}], "w": "六波羅探題", "q": "承久の乱のあと、幕府が京都に置いて朝廷や西国を監視した役所を何というか。"}, {"t": "北条泰時が執権になる", "m": "評定（話し合い）の政治を整えた執権", "d": "有力御家人による話し合い（評定）で政治を進めるしくみを整えた。", "ax": "pol", "y": 1224, "cf": [{"t": "北条時宗", "m": "元寇のとき幕府を率いた執権"}], "w": "北条泰時", "q": "御成敗式目を定め、評定（話し合い）による政治を整えた執権はだれか。"}, {"t": "御成敗式目（貞永式目）", "m": "北条泰時が定めた、武家初のまとまった法律", "d": "執権北条泰時が定めた、武家で初めてのまとまった法律。", "ax": "pol", "y": 1232, "cf": [{"t": "武家諸法度", "m": "江戸幕府が大名を統制するために定めた法"}, {"t": "十七条の憲法", "m": "聖徳太子が役人の心得を示したきまり"}, {"t": "大宝律令", "m": "唐にならって定めた律令国家の法"}, {"t": "分国法", "m": "戦国大名が領国を治めるために定めた法"}], "w": "御成敗式目", "q": "1232年に北条泰時が定めた、武家で初めてのまとまった法律を何というか。"}, {"t": "永仁の徳政令", "m": "御家人の借金を帳消しにした幕府の命令", "d": "生活に苦しむ御家人を救うため借金を帳消しにしたが、効果は一時的だった。", "ax": "pol", "y": 1297, "cf": [{"t": "武家諸法度", "m": "江戸幕府が大名を統制するために定めた法"}, {"t": "分国法", "m": "戦国大名が領国を治めるために定めた法"}], "w": "永仁の徳政令", "q": "御家人を救うために借金を帳消しにした、1297年の幕府の法令を何というか。"}, {"t": "後醍醐天皇の倒幕運動", "m": "後醍醐天皇が幕府を倒そうと兵を挙げたこと", "d": "政治の立て直しをめざす後醍醐天皇が、幕府を倒そうと兵を挙げる。", "ax": "pol", "y": 1331, "cf": [{"t": "建武の新政", "m": "後醍醐天皇による天皇中心の政治"}], "w": "倒幕運動", "q": "後醍醐天皇が鎌倉幕府を倒そうとして起こした動きを何というか。"}, {"t": "鎌倉幕府の滅亡", "m": "足利尊氏・新田義貞らにより幕府が倒れたこと", "d": "足利尊氏・新田義貞らによって幕府が倒される。", "ax": "pol", "y": 1333, "w": "鎌倉幕府の滅亡", "q": "1333年、足利尊氏や新田義貞らによって鎌倉幕府がたおれたできごとを何というか。"}, {"t": "壇ノ浦の戦い（平氏の滅亡）", "m": "源義経らが平氏をほろぼした戦い", "d": "源義経らが平氏を破り、源平の争乱が終わる。", "ax": "war", "y": 1185, "cf": [{"t": "一ノ谷の戦い", "m": "源平の争乱で源氏が平氏を破った戦い"}], "w": "壇ノ浦の戦い", "q": "1185年、源義経らが平氏をほろぼした戦いを何というか。"}, {"t": "奥州藤原氏の滅亡", "m": "頼朝が東北を平定し全国を支配したこと", "d": "頼朝が東北を平定し、全国を支配下に置く。", "ax": "war", "y": 1189, "w": "奥州藤原氏", "q": "頼朝に平定された、平泉を拠点として栄えた一族を何というか。"}, {"t": "モンゴル帝国の成立（チンギス＝ハン）", "m": "チンギス＝ハンが築いたモンゴルの大帝国", "d": "チンギス＝ハンがモンゴルの諸部族を統一し、ユーラシアにまたがる大帝国のもとを築く。", "ax": "wld", "y": 1206, "w": "モンゴル帝国", "q": "チンギス＝ハンが諸部族を統一して築いた、ユーラシアにまたがる大帝国を何というか。"}, {"t": "承久の乱", "m": "後鳥羽上皇が挙兵し幕府が勝った戦い", "d": "後鳥羽上皇が挙兵するも幕府軍が勝利。武家の力が朝廷を上回ることを示した。", "ax": "war", "y": 1221, "cf": [{"t": "応仁の乱", "m": "室町時代、京都で起きた大乱（戦国の始まり）"}, {"t": "保元の乱", "m": "平安末、天皇と上皇の争いに武士が動員された乱"}], "w": "承久の乱", "q": "1221年、後鳥羽上皇が幕府を倒そうと兵を挙げた戦いを何というか。"}, {"t": "フビライ＝ハン、元を建てる", "m": "フビライが国号を元とし大都に都を置いたこと", "d": "モンゴル帝国のフビライが国号を元とし、都を大都（現在の北京）に置く。高麗も従えた。", "ax": "wld", "y": 1271, "w": "フビライ＝ハン", "q": "国号を元と定め、都を大都に置いて日本にも服属を求めたモンゴル帝国の皇帝はだれか。"}, {"t": "元の服属要求", "m": "フビライが日本に服属を求めたこと", "d": "フビライが日本に服属を求めるが、執権北条時宗はこれを退けた。", "ax": "war", "y": 1272, "w": "元の服属要求", "q": "フビライが日本に服属を求めたが、執権北条時宗が退けたできごとを何というか。"}, {"t": "文永の役（元寇①）", "m": "1274年、元が初めて九州北部に襲来したこと", "d": "元と高麗の軍が九州北部に襲来する。集団戦法や火薬の武器（てつはう）に御家人は苦しんだ。", "ax": "war", "y": 1274, "w": "文永の役", "q": "1274年、元と高麗の軍が初めて九州北部に襲来したできごとを何というか。"}, {"t": "防塁（石塁）の築造", "m": "再襲来に備え博多湾岸に築いた石の防壁", "d": "再びの襲来に備え、博多湾岸に石の防壁を築く。費用は御家人が負担した。", "ax": "war", "y": 1276, "w": "防塁（石塁）", "q": "元の再襲来に備えて博多湾岸に築かれた石の防壁を何というか。"}, {"t": "弘安の役（元寇②）", "m": "1281年、元の二度目の襲来（暴風雨で撤退）", "d": "元軍が再び襲来するが、暴風雨もあって引き上げた。", "ax": "war", "y": 1281, "w": "弘安の役", "q": "1281年、元軍が再び襲来したが暴風雨もあって退いたできごとを何というか。"}, {"t": "マルコ＝ポーロと東西の交流", "m": "日本を黄金の国と伝えたとされる人物（東西交流）", "d": "モンゴル帝国のもとで東西の交流がさかんに。元を訪れたマルコ＝ポーロは、日本を「黄金の国ジパング」と西方に伝えたとされる。", "ax": "wld", "y": 1290, "cf": [{"t": "コロンブス", "m": "大西洋を渡り西インド諸島に到達した人物"}], "w": "マルコ＝ポーロ", "q": "元を訪れ、日本を「黄金の国ジパング」と西方に伝えたとされる人物はだれか。"}, {"t": "御恩と奉公（御家人のしくみ）", "m": "土地を仲立ちにした将軍と御家人の主従関係", "d": "将軍が御家人の領地を保護し（御恩）、御家人は戦いで奉公する。土地を仲立ちにした主従関係。", "ax": "eco", "y": 1190, "w": "御恩と奉公", "q": "将軍が御家人の領地を保護し、御家人が戦いで奉公する、土地を仲立ちにした主従関係を何というか。"}, {"t": "宋銭の流通", "m": "日宋貿易で入った中国の銭が広く使われたこと", "d": "日宋貿易で入ってきた中国の銭が広く使われ、貨幣を使う経済が広がる。", "ax": "eco", "y": 1205, "cf": [{"t": "明銭（永楽通宝）", "m": "日明貿易で入った明の銅銭"}, {"t": "和同開珎", "m": "奈良時代につくられた貨幣"}], "w": "宋銭", "q": "日宋貿易によって日本に入り、広く使われた中国の銭を何というか。"}, {"t": "地頭の支配の広がり", "m": "地頭が土地や農民への支配を強めたこと", "d": "地頭が年貢の取り立てなどを通じて、土地や農民への支配を強めていく。", "ax": "eco", "y": 1238, "w": "地頭の支配拡大", "q": "地頭が年貢の取り立てなどを通じて、土地や農民への支配を強めていったことを何というか。"}, {"t": "農業の発達（二毛作）", "m": "同じ田畑で米と麦をつくる二毛作の広まり", "d": "同じ田畑で米と麦をつくる二毛作が広まる。牛馬や草木灰の利用も進み、生産力が上がる。", "ax": "eco", "y": 1250, "cf": [{"t": "二期作", "m": "同じ田で年2回、同じ作物（米）をつくること"}], "w": "二毛作", "q": "同じ田畑で1年に米と麦をつくる農業のやり方を何というか。"}, {"t": "定期市（三斎市）", "m": "月3回ひらかれた市（商業の発達）", "d": "月に3回開かれる市が各地に生まれ、商業が発達する。", "ax": "eco", "y": 1262, "cf": [{"t": "楽市・楽座", "m": "織田信長が市の税や座を廃した政策"}, {"t": "株仲間", "m": "江戸時代の商人の同業組合"}], "w": "定期市", "q": "鎌倉時代、月に3回など決まった日に開かれた市を何というか。"}, {"t": "恩賞不足と御家人の負担", "m": "元寇で恩賞が足りず御家人が苦しんだこと", "d": "元寇は防衛戦で新しい領地が得られず、恩賞が足りなかった。防衛の費用も重くのしかかった。", "ax": "eco", "y": 1282, "w": "恩賞不足", "q": "元寇が防衛戦だったため新しい領地が得られず、御家人への恩賞が足りなかったことを何というか。"}, {"t": "分割相続と御家人の窮乏", "m": "相続で領地が細かく分かれ御家人が困窮したこと", "d": "相続のたびに領地が細かく分かれ、御家人がしだいに生活に苦しむようになる。", "ax": "eco", "y": 1295, "w": "分割相続", "q": "相続のたびに領地が子に分けられ、御家人の生活を苦しくさせた相続のしかたを何というか。"}, {"t": "浄土宗（法然）", "m": "念仏（南無阿弥陀仏）を唱える教え", "d": "「南無阿弥陀仏」と念仏を唱えれば救われると説き、広く信仰された。", "ax": "cul", "y": 1190, "cf": [{"t": "天台宗（最澄）", "m": "平安初期、最澄が広めた仏教"}, {"t": "真言宗（空海）", "m": "平安初期、空海が広めた仏教"}], "w": "浄土宗", "q": "法然が開いた、念仏（南無阿弥陀仏）を唱えれば救われると説いた宗派を何というか。"}, {"t": "臨済宗・曹洞宗（栄西・道元）", "m": "座禅で自らをきたえる禅宗", "d": "栄西が臨済宗、道元が曹洞宗を伝える。座禅で自らをきたえる禅宗は武士の気風に合った。", "ax": "cul", "y": 1202, "w": "臨済宗・曹洞宗", "q": "栄西や道元が伝えた、座禅で自らをきたえる仏教を何というか。"}, {"t": "東大寺南大門・金剛力士像", "m": "運慶・快慶らがつくった力強い彫刻", "d": "再建された東大寺の南大門に、運慶・快慶らが力強い金剛力士像をつくった。", "ax": "cul", "y": 1203, "cf": [{"t": "阿修羅像", "m": "奈良時代の天平文化を代表する仏像"}], "w": "金剛力士像", "q": "運慶・快慶らがつくった、東大寺南大門に置かれた力強い彫刻を何というか。"}, {"t": "新古今和歌集", "m": "後鳥羽上皇の命で編まれた和歌集", "d": "後鳥羽上皇の命により編集された和歌集。", "ax": "cul", "y": 1205, "cf": [{"t": "古今和歌集", "m": "平安時代、紀貫之らが編んだ和歌集"}, {"t": "万葉集", "m": "奈良時代の現存最古の和歌集"}], "w": "新古今和歌集", "q": "後鳥羽上皇の命令で藤原定家らがまとめた和歌集を何というか。"}, {"t": "方丈記（鴨長明）", "m": "鴨長明が無常をつづった随筆", "d": "世の中の無常をつづった随筆。", "ax": "cul", "y": 1212, "cf": [{"t": "枕草子", "m": "清少納言が書いた平安時代の随筆"}], "w": "方丈記", "q": "鴨長明が世の無常をつづった随筆を何というか。"}, {"t": "平家物語", "m": "琵琶法師が語り広めた軍記物語", "d": "琵琶法師によって語り広められた軍記物語。", "ax": "cul", "y": 1220, "cf": [{"t": "源氏物語", "m": "紫式部が書いた平安時代の長編物語"}], "w": "平家物語", "q": "琵琶法師によって語り広められた軍記物語を何というか。"}, {"t": "浄土真宗（親鸞）", "m": "「悪人こそ救われる」と説いた教え", "d": "法然の教えを受けつぎ、「悪人こそ救われる」と説いて武士や庶民に広まる。", "ax": "cul", "y": 1224, "w": "浄土真宗", "q": "親鸞が開いた、「悪人こそ救われる」と説いた宗派を何というか。"}, {"t": "日蓮宗（法華宗）", "m": "題目（南無妙法蓮華経）を唱える教え", "d": "日蓮が「南無妙法蓮華経」の題目を唱えることを説く。", "ax": "cul", "y": 1253, "w": "日蓮宗", "q": "日蓮が開いた、題目（南無妙法蓮華経）を唱える宗派を何というか。"}, {"t": "時宗（一遍）", "m": "踊念仏を取り入れ各地を歩いた教え", "d": "踊念仏を取り入れ、念仏の札を配りながら各地を歩いて教えを広めた。", "ax": "cul", "y": 1276, "cf": [{"t": "北条時宗", "m": "元寇のとき幕府を率いた執権"}], "w": "時宗", "q": "一遍が開いた、踊念仏を取り入れて広めた宗派を何というか。"}, {"t": "蒙古襲来絵詞", "m": "竹崎季長が元寇を描かせた絵巻", "d": "御家人の竹崎季長が、恩賞を求めるためにみずからの戦いを描かせた絵巻。", "ax": "cul", "y": 1293, "w": "蒙古襲来絵詞", "q": "御家人の竹崎季長が、元寇での自分の戦いを描かせた絵巻を何というか。"}, {"t": "徒然草（兼好法師）", "m": "兼好法師が書いた随筆", "d": "鎌倉時代の終わりごろに書かれた随筆。", "ax": "cul", "y": 1331, "cf": [{"t": "枕草子", "m": "清少納言が書いた平安時代の随筆"}], "w": "徒然草", "q": "兼好法師が書いた、鎌倉時代の終わりごろの随筆を何というか。"}, {"t": "十字軍の遠征", "m": "聖地の奪回をめざすヨーロッパの遠征", "d": "11世紀末から、ヨーロッパのキリスト教徒が聖地エルサレムの奪回をめざして遠征（十字軍）をくり返した。東西の交流が進んだ。", "ax": "wld", "y": 1189, "w": "十字軍", "q": "11世紀末から、ヨーロッパのキリスト教徒が聖地エルサレムの奪回をめざして行った遠征を何というか。"}, {"t": "元が中国を統一（南宋の滅亡）", "m": "元が南宋をほろぼし中国を統一したこと", "d": "フビライの元が南宋をほろぼし、中国全土を支配下に置いた。この力が二度目の日本襲来にもつながった。", "ax": "wld", "y": 1279, "w": "元の中国統一", "q": "フビライの元が南宋をほろぼし、中国全土を支配したことを何というか。"}], "asuka": [{"t": "冠位十二階（聖徳太子）", "ax": "pol", "y": 603, "d": "聖徳太子が推古天皇のもとで、家がらでなく才能や功績で役人を用いるしくみを定めた。", "w": "冠位十二階", "m": "才能や功績で役人を取り立てる制度", "q": "603年に聖徳太子が定めた、家がらでなく才能で役人を取り立てる制度を何というか。", "cf": [{"t": "十七条の憲法", "m": "聖徳太子が役人の心得を示したきまり"}]}, {"t": "十七条の憲法", "ax": "pol", "y": 604, "d": "役人の心がまえを示し、天皇中心の政治と、仏教などをうやまう考えを説いた。", "w": "十七条の憲法", "m": "役人の心がまえを示したきまり", "q": "604年に聖徳太子が、役人の心がまえを示すために定めたきまりを何というか。", "cf": [{"t": "冠位十二階", "m": "才能で役人を取り立てる制度"}, {"t": "御成敗式目", "m": "北条泰時が定めた武家初の法律"}, {"t": "大宝律令", "m": "唐にならって定めた律令国家の法"}]}, {"t": "大化の改新", "ax": "pol", "y": 645, "d": "中大兄皇子と中臣鎌足が蘇我氏をたおし、天皇中心の国づくり（公地公民など）を始めた。", "w": "大化の改新", "m": "天皇中心の国づくりを始めた改革", "q": "645年に中大兄皇子と中臣鎌足が蘇我氏をたおして始めた、天皇中心の国づくりを何というか。", "cf": [{"t": "大宝律令", "m": "唐にならって定めた律令国家の法"}]}, {"t": "壬申の乱（天武天皇）", "ax": "pol", "y": 672, "d": "あとつぎ争いに勝った天武天皇が、天皇の力を強めて律令国家づくりを進めた。", "w": "壬申の乱", "m": "天武天皇が勝ったあとつぎ争い", "q": "672年、あとつぎ争いに勝った天武天皇が天皇の力を強めた戦乱を何というか。", "cf": [{"t": "保元の乱", "m": "平安時代末の天皇家・貴族の争い"}]}, {"t": "藤原京への遷都（持統天皇）", "ax": "pol", "y": 694, "d": "唐の都にならった、日本で初めての本格的な都がつくられた。", "w": "藤原京", "m": "日本で初めての本格的な都", "q": "694年に持統天皇が移した、日本で初めての本格的な都を何というか。", "cf": [{"t": "平城京", "m": "奈良に置かれた唐の長安にならった都"}, {"t": "平安京", "m": "桓武天皇が京都に移した都"}]}, {"t": "大宝律令", "ax": "pol", "y": 701, "d": "唐の律令にならって定められた法律。天皇を中心とする律令国家のしくみが完成した。", "w": "大宝律令", "m": "唐にならって定めた律令国家の法", "q": "701年に唐の律令にならって定められた、律令国家のしくみを完成させた法律を何というか。", "cf": [{"t": "十七条の憲法", "m": "聖徳太子が役人の心得を示したきまり"}, {"t": "御成敗式目", "m": "北条泰時が定めた武家初の法律"}]}, {"t": "遣隋使の派遣（小野妹子）", "ax": "war", "y": 607, "d": "聖徳太子が隋の進んだ制度や文化を学ぶため、小野妹子らを送った。", "w": "遣隋使", "m": "隋の制度・文化を学ぶため送った使い", "q": "607年、聖徳太子が小野妹子らを送った、隋へのつかいを何というか。", "cf": [{"t": "遣唐使", "m": "唐の制度・文化を学ぶため送った使い"}]}, {"t": "隋がほろび唐がおこる", "ax": "wld", "y": 618, "d": "中国で隋がほろび、大帝国の唐が成立。東アジアの中心となった。", "w": "唐", "m": "隋にかわり中国を治めた大帝国", "q": "618年に隋にかわっておこり、東アジアの中心となった中国の王朝を何というか。", "cf": [{"t": "隋", "m": "長く分かれていた中国を統一した王朝"}, {"t": "宋", "m": "唐のあとに中国をまとめた王朝"}]}, {"t": "遣唐使の始まり", "ax": "war", "y": 630, "d": "唐の制度・文化を学ぶため、遣唐使が送られるようになった。", "w": "遣唐使", "m": "唐の制度・文化を学ぶため送った使い", "q": "630年から始まった、唐の制度や文化を学ぶために送られたつかいを何というか。", "cf": [{"t": "遣隋使", "m": "隋の制度・文化を学ぶため送った使い"}]}, {"t": "白村江の戦い", "ax": "war", "y": 663, "d": "滅んだ百済を助けようとした日本が、唐と新羅の連合軍に大敗した。", "w": "白村江の戦い", "m": "日本が唐・新羅連合軍に大敗した戦い", "q": "663年、百済を助けようとした日本が唐と新羅の連合軍に大敗した戦いを何というか。"}, {"t": "防衛の強化（水城・大宰府）", "ax": "war", "y": 665, "d": "白村江の敗戦のあと、九州北部に水城や山城を築き、大宰府を守りを固めた。", "w": "大宰府", "m": "九州を守り治めるために置かれた役所", "q": "白村江の戦いの後、九州北部の守りと九州の政治のために置かれた役所を何というか。", "cf": [{"t": "多賀城", "m": "東北の蝦夷に備えて置かれた拠点"}]}, {"t": "公地公民の方針", "ax": "eco", "y": 646, "d": "大化の改新で、土地と人民を豪族の私有から国家が直接治めるものへと改めようとした。", "w": "公地公民", "m": "土地と人民を国家が直接治める方針", "q": "大化の改新で示された、土地と人民を国家が直接治めようとする方針を何というか。", "cf": [{"t": "墾田永年私財法", "m": "新しく開いた土地の永久私有を認めた法"}]}, {"t": "戸籍づくり（公地公民）", "ax": "eco", "y": 670, "d": "全国的な戸籍がつくられ、人々を国家が直接に把握するしくみが整えられた。", "w": "戸籍", "m": "人々を国家が直接把握する台帳", "q": "670年に全国的につくられた、人々を国家が直接に把握するための台帳を何というか。", "cf": [{"t": "班田収授法", "m": "戸籍にもとづき口分田をあたえる制度"}]}, {"t": "富本銭の鋳造", "ax": "eco", "y": 683, "d": "日本で最も古いとされる銭が発行された。", "w": "富本銭", "m": "日本で最も古いとされる銭", "q": "683年ごろにつくられた、日本で最も古いとされる銭を何というか。", "cf": [{"t": "和同開珎", "m": "唐の貨幣にならってつくられた銭"}]}, {"t": "班田収授のしくみ", "ax": "eco", "y": 690, "d": "戸籍にもとづいて口分田をあたえ、租・調などの税をとるしくみが整えられていった。", "w": "班田収授法", "m": "戸籍にもとづき口分田をあたえる制度", "q": "戸籍にもとづいて口分田をあたえ、死ぬと国に返させたしくみを何というか。", "cf": [{"t": "墾田永年私財法", "m": "新しく開いた土地の永久私有を認めた法"}, {"t": "公地公民", "m": "土地と人民を国家が直接治める方針"}]}, {"t": "仏教の伝来", "ax": "  "農民に課された税の負担", "q": "奈良時代の農民に課された、稲や布・特産物などを納める税をまとめて何というか。", "cf": [{"t": "防人", "m": "九州北部の守りにあたった兵役"}]}, {"t": "墾田永年私財法", "ax": "eco", "y": 743, "d": "新しく開いた土地の永久私有を認めた。律令の土地制度がくずれるきっかけになった。", "w": "墾田永年私財法", "m": "新しく開いた土地の永久私有を認めた法", "q": "743年、新しく開いた土地の永久の私有を認めた法律を何というか。", "cf": [{"t": "班田収授法", "m": "戸籍にもとづき口分田をあたえる制度"}, {"t": "公地公民", "m": "土地と人民を国家が直接治める方針"}]}, {"t": "荘園の始まり", "ax": "eco", "y": 750, "d": "貴族や寺社が広い土地を開いて私有地（初期の荘園）を広げていった。", "w": "荘園", "m": "貴族や寺社が広げた私有地", "q": "奈良時代以降、貴族や寺社が開いて広げていった私有地を何というか。"}, {"t": "古事記", "ax": "cul", "y": 712, "d": "国の成り立ちを伝える、現存する日本最古の歴史書。", "w": "古事記", "m": "現存する日本最古の歴史書", "q": "国の成り立ちを伝える、現存する日本最古の歴史書を何というか。", "cf": [{"t": "日本書紀", "m": "国家がまとめた正式な歴史書"}]}, {"t": "日本書紀", "ax": "cul", "y": 720, "d": "唐にならって国家がまとめた、正式な歴史書。", "w": "日本書紀", "m": "国家がまとめた正式な歴史書", "q": "720年、唐にならって国家がまとめた正式な歴史書を何というか。", "cf": [{"t": "古事記", "m": "現存する日本最古の歴史書"}]}, {"t": "国分寺の建立", "ax": "cul", "y": 741, "d": "聖武天皇の命で、国ごとに国分寺・国分尼寺が建てられた。", "w": "国分寺", "m": "国ごとに建てられた寺", "q": "聖武天皇の命で、国ごとに建てられた寺を何というか。", "cf": [{"t": "東大寺", "m": "大仏が置かれた都の中心の寺"}]}, {"t": "東大寺の大仏", "ax": "cul", "y": 752, "d": "聖武天皇が国家の平安を願って造らせた大仏が完成し、開眼の儀式が行われた。", "w": "東大寺", "m": "聖武天皇が大仏を造らせた寺", "q": "聖武天皇が国家の平安を願って大仏を造らせた、奈良の寺を何というか。", "cf": [{"t": "法隆寺", "m": "現存する世界最古の木造建築とされる寺"}, {"t": "国分寺", "m": "国ごとに建てられた寺"}]}, {"t": "正倉院・天平文化", "ax": "cul", "y": 756, "d": "遣唐使が伝えた国際色ゆたかな天平文化。正倉院にはシルクロードの宝物が納められた。", "w": "天平文化", "m": "奈良時代の国際色ゆたかな文化", "q": "遣唐使が伝えた、正倉院の宝物に代表される奈良時代の文化を何というか。", "cf": [{"t": "飛鳥文化", "m": "日本で最初の仏教文化"}, {"t": "国風文化", "m": "平安時代の日本風の貴族文化"}]}, {"t": "万葉集", "ax": "cul", "y": 760, "d": "天皇や貴族から農民・防人まで、はば広い人々の和歌を集めた歌集。", "w": "万葉集", "m": "はば広い人々の和歌を集めた歌集", "q": "天皇や貴族から農民・防人まで、はば広い人々の和歌を集めた奈良時代の歌集を何というか。", "cf": [{"t": "古今和歌集", "m": "平安時代の最初の勅撰和歌集"}, {"t": "新古今和歌集", "m": "鎌倉時代の勅撰和歌集"}]}, {"t": "唐の繁栄（都・長安）", "ax": "wld", "y": 720, "d": "唐の都長安は国際都市としてにぎわい、シルクロードを通じて西方の文化も集まった。", "w": "長安", "m": "唐の都として栄えた国際都市", "q": "シルクロードを通じて西方の文化も集まった、唐の都を何というか。", "cf": [{"t": "平城京", "m": "長安にならった奈良の都"}]}, {"t": "アッバース朝がおこる", "ax": "wld", "y": 750, "d": "イスラム帝国が最も栄え、都バグダッドが交易と学問の中心となった。", "w": "イスラム帝国", "m": "バグダッドを都に最も栄えた帝国", "q": "8世紀、都バグダッドを中心に最も栄えた、西アジアの大帝国を何というか。"}, {"t": "安史の乱（唐のおとろえ）", "ax": "wld", "y": 755, "d": "大きな反乱がおこり、唐の国力が弱まり始めた。", "w": "安史の乱", "m": "唐の国力が弱まり始めた反乱", "q": "8世紀なかば、唐の国力が弱まるきっかけとなった大きな反乱を何というか。"}], "heian": [{"t": "平安京に都を移す（桓武天皇）", "ax": "pol", "y": 794, "d": "桓武天皇が都を京都の平安京に移し、律令政治の立て直しをめざした。ここから平安時代が始まる。", "w": "平安京", "m": "桓武天皇が京都に移した都", "q": "794年に桓武天皇が京都に移し、平安時代の始まりとなった都を何というか。", "cf": [{"t": "平城京", "m": "唐の長安にならった奈良の都"}, {"t": "藤原京", "m": "日本で初めての本格的な都"}]}, {"t": "藤原良房が摂政になる", "ax": "pol", "y": 866, "d": "天皇が幼いとき代わって政治を行う摂政に、皇族以外で初めて藤原良房が就く。", "w": "摂政", "m": "幼い天皇に代わって政治を行う役職", "q": "藤原良房が皇族以外で初めて就いた、幼い天皇に代わって政治を行う役職を何というか。", "cf": [{"t": "関白", "m": "成人した天皇を助けて政治を行う役職"}]}, {"t": "藤原基経が関白になる", "ax": "pol", "y": 887, "d": "成人した天皇を助けて政治を行う関白に藤原基経が就き、藤原氏の摂関政治が本格化する。", "w": "関白", "m": "成人した天皇を助けて政治を行う役職", "q": "藤原基経が就いた、成人した天皇を助けて政治を行う役職を何というか。", "cf": [{"t": "摂政", "m": "幼い天皇に代わって政治を行う役職"}]}, {"t": "藤原道長が摂政になる", "ax": "pol", "y": 1016, "d": "道長・頼通父子のころ、藤原氏の摂関政治が全盛をむかえる。", "w": "藤原道長", "m": "摂関政治の全盛を築いた人物", "q": "子の頼通とともに、藤原氏の摂関政治の全盛を築いた人物はだれか。", "cf": [{"t": "藤原頼通", "m": "平等院鳳凰堂を建てた道長の子"}]}, {"t": "白河上皇の院政が始まる", "ax": "pol", "y": 1086, "d": "天皇の位をゆずった上皇が、院（上皇の御所）で政治を動かすようになる。", "w": "院政", "m": "位をゆずった上皇が行う政治", "q": "天皇の位をゆずった上皇が、院で政治を動かすことを何というか。", "cf": [{"t": "摂関政治", "m": "藤原氏が摂政・関白として行った政治"}]}, {"t": "平清盛が太政大臣になる", "ax": "pol", "y": 1167, "d": "武士として初めて太政大臣となり、平氏が政治の実権をにぎる。", "w": "平清盛", "m": "武士で初めて太政大臣となった人物", "q": "武士として初めて太政大臣となり、平氏の政治を進めた人物はだれか。"}, {"t": "坂上田村麻呂、征夷大将軍に", "ax": "war", "y": 797, "d": "東北の蝦夷（えみし）を平定するため派遣され、朝廷の支配を広げた。", "w": "坂上田村麻呂", "m": "蝦夷平定に送られた征夷大将軍", "q": "東北の蝦夷を平定するため、征夷大将軍として送られた人物はだれか。"}, {"t": "遣唐使の停止", "ax": "war", "y": 894, "d": "菅原道真の提案で、衰えた唐への使いを取りやめる。中国の影響がしだいにうすれていく。", "w": "菅原道真", "m": "遣唐使の停止を提案した人物", "q": "894年、おとろえた唐への遣唐使の停止を提案した人物はだれか。"}, {"t": "平将門・藤原純友の乱", "ax": "war", "y": 939, "d": "関東で平将門、瀬戸内で藤原純友が反乱を起こす。これを武士がしずめ、武士が力をつけていく。", "w": "平将門", "m": "関東で反乱を起こした武士", "q": "10世紀なかば、関東で朝廷に反乱を起こした武士はだれか。", "cf": [{"t": "藤原純友", "m": "瀬戸内で反乱を起こした武士"}]}, {"t": "前九年合戦", "ax": "war", "y": 1056, "d": "東北の争いを源氏（源頼義・義家）がしずめ、東国の武士との結びつきを強める。", "w": "前九年合戦", "m": "源氏が東北の争いをしずめた戦い", "q": "源頼義・義家が東北の争いをしずめ、東国の武士と結びつきを強めた戦いを何というか。", "cf": [{"t": "後三年合戦", "m": "源義家が東北の争いをしずめた戦い"}]}, {"t": "後三年合戦", "ax": "war", "y": 1085, "d": "源義家が東北の争いをしずめ、源氏が東国の武士のかしらとして信頼を集める。", "w": "後三年合戦", "m": "源義家が東北の争いをしずめた戦い", "q": "源義家が東北の争いをしずめ、源氏が東国の武士の信頼を集めた戦いを何というか。", "cf": [{"t": "前九年合戦", "m": "源頼義・義家が東北の争いをしずめた戦い"}]}, {"t": "保元の乱", "ax": "war", "y": 1156, "d": "天皇家や貴族の争いに源氏・平氏の武士が加わって戦う。武士の力が中央で示される。", "w": "保元の乱", "m": "源平の武士が加わった天皇家・貴族の争い", "q": "1156年、天皇家や貴族の争いに源氏・平氏の武士が加わって戦ったできごとを何というか。", "cf": [{"t": "平治の乱", "m": "平清盛が源義朝を破った戦い"}, {"t": "壬申の乱", "m": "天武天皇が勝ったあとつぎ争い"}]}, {"t": "平治の乱", "ax": "war", "y": 1159, "d": "平清盛が源義朝を破り、武士のなかで平氏が優位に立つ。", "w": "平治の乱", "m": "平清盛が源義朝を破った戦い", "q": "1159年、平清盛が源義朝を破り、平氏が優位に立った戦いを何というか。", "cf": [{"t": "保元の乱", "m": "源平の武士が加わった天皇家・貴族の争い"}]}, {"t": "壇ノ浦の戦い（平氏の滅亡）", "ax": "war", "y": 1185, "d": "源義経らが平氏を破り、源平の争乱が終わる。武士の世へと移っていく。", "w": "壇ノ浦の戦い", "m": "源義経らが平氏をほろぼした戦い", "q": "1185年、源義経らが平氏をほろぼした戦いを何というか。"}, {"t": "荘園の広がり", "ax": "eco", "y": 900, "d": "貴族や寺社が私有地（荘園）を増やし、税が朝廷に集まりにくくなる。", "w": "荘園", "m": "貴族や寺社が増やした私有地", "q": "平安時代、税が朝廷に集まりにくくなる原因となった、貴族や寺社の私有地を何というか。"}, {"t": "荘園の寄進が進む", "ax": "eco", "y": 1040, "d": "地方の有力者が、税をのがれるため藤原氏など中央の権力者に荘園を寄進する。", "w": "寄進", "m": "税をのがれるため有力者に荘園を預けること", "q": "地方の有力者が税をのがれるため、中央の権力者に荘園を預けたことを何というか。"}, {"t": "武士の成長", "ax": "eco", "y": 1090, "d": "地方で武装した有力者が領地を守る武士に成長し、都の貴族にも仕えるようになる。", "w": "武士", "m": "領地を守るため武装した有力者", "q": "平安時代、地方で領地を守るため武装し、都の貴族にも仕えるようになった人々を何というか。"}, {"t": "日宋貿易（平清盛）", "ax": "eco", "y": 1170, "d": "清盛が大輪田泊（兵庫の港）を整え、宋との貿易を進めて大きな利益を得た。", "w": "日宋貿易", "m": "平清盛が進めた宋との貿易", "q": "平清盛が大輪田泊を整えて進めた、宋との貿易を何というか。", "cf": [{"t": "日明貿易（勘合貿易）", "m": "室町時代に明と行った貿易"}]}, {"t": "天台宗（最澄・比叡山延暦寺）", "ax": "cul", "y": 805, "d": "最澄が唐から天台宗を伝え、比叡山に延暦寺を開く。", "w": "天台宗", "m": "最澄が唐から伝えた仏教の宗派", "q": "最澄が唐から伝え、比叡山延暦寺を中心に広めた仏教の宗派を何というか。", "cf": [{"t": "真言宗", "m": "空海が伝えた密教の宗派"}]}, {"t": "真言宗（空海・高野山金剛峯寺）", "ax": "cul", "y": 806, "d": "空海が唐から真言宗（密教）を伝え、高野山に金剛峯寺を開く。", "w": "真言宗", "m": "空海が唐から伝えた密教の宗派", "q": "空海が唐から伝え、高野山金剛峯寺を中心に広めた仏教の宗派を何というか。", "cf": [{"t": "天台宗", "m": "最澄が伝えた仏教の宗派"}]}, {"t": "かな文字の発達", "ax": "cul", "y": 900, "d": "漢字をもとにひらがな・かたかなが生まれ、日本語の細やかな表現ができるようになる。", "w": "かな文字", "m": "漢字をもとに生まれた日本の文字", "q": "漢字をもとに生まれ、日本語を細やかに表せるようになった文字を何というか。"}, {"t": "古今和歌集（紀貫之ら）", "ax": "cul", "y": 905, "d": "天皇の命で編集された、最初の勅撰和歌集。", "w": "古今和歌集", "m": "最初の勅撰和歌集", "q": "紀貫之らが天皇の命で編集した、最初の勅撰和歌集を何というか。", "cf": [{"t": "万葉集", "m": "奈良時代のはば広い人々の和歌集"}, {"t": "新古今和歌集", "m": "鎌倉時代の勅撰和歌集"}]}, {"t": "枕草子（清少納言）", "ax": "cul", "y": 1001, "d": "宮廷の暮らしを生き生きとつづった随筆。", "w": "枕草子", "m": "清少納言が宮廷の暮らしをつづった随筆", "q": "清少納言が宮廷の暮らしを生き生きとつづった随筆を何というか。", "cf": [{"t": "源氏物語", "m": "紫式部が書いた長編物語"}, {"t": "徒然草", "m": "兼好法師が書いた随筆"}]}, {"t": "源氏物語（紫式部）", "ax": "cul", "y": 1008, "d": "かな文字で書かれた長編物語。国風文化を代表する作品。", "w": "源氏物語", "m": "紫式部が書いた長編物語", "q": "紫式部がかな文字で書いた、国風文化を代表する長編物語を何というか。", "cf": [{"t": "枕草子", "m": "清少納言が書いた随筆"}]}, {"t": "寝殿造・大和絵", "ax": "cul", "y": 1030, "d": "貴族の住まい（寝殿造）や、日本の風景をえがく大和絵など、日本風の文化が広がる。", "w": "寝殿造", "m": "平安時代の貴族の住まいのつくり", "q": "平安時代の貴族の住まいのつくりを何というか。", "cf": [{"t": "書院造", "m": "室町時代に生まれた武家の住まいのつくり"}]}, {"t": "浄土信仰・末法思想", "ax": "cul", "y": 1052, "d": "仏教がおとろえるという末法思想が広まり、阿弥陀仏にすがる浄土信仰が流行する。", "w": "浄土信仰", "m": "阿弥陀仏にすがり極楽往生を願う信仰", "q": "阿弥陀仏にすがって極楽往生を願う、平安時代に流行した信仰を何というか。", "cf": [{"t": "末法思想", "m": "仏教がおとろえるという考え"}]}, {"t": "平等院鳳凰堂（藤原頼通）", "ax": "cul", "y": 1053, "d": "藤原頼通が宇治に建てた阿弥陀堂。極楽浄土をこの世に表そうとした。", "w": "平等院鳳凰堂", "m": "藤原頼通が宇治に建てた阿弥陀堂", "q": "藤原頼通が宇治に建てた、極楽浄土を表そうとした阿弥陀堂を何というか。", "cf": [{"t": "中尊寺金色堂", "m": "奥州藤原氏が平泉に建てた阿弥陀堂"}]}, {"t": "中尊寺金色堂（奥州藤原氏）", "ax": "cul", "y": 1124, "d": "奥州藤原氏が平泉に建てた、金色にかがやく阿弥陀堂。院政期の文化を代表する。", "w": "中尊寺金色堂", "m": "奥州藤原氏が平泉に建てた阿弥陀堂", "q": "奥州藤原氏が平泉に建てた、金色にかがやく阿弥陀堂を何というか。", "cf": [{"t": "平等院鳳凰堂", "m": "藤原頼通が宇治に建てた阿弥陀堂"}]}, {"t": "唐がほろびる", "ax": "wld", "y": 907, "d": "栄えた唐も内乱でおとろえ、ついにほろびた。日本は894年に遣唐使を停止していた。", "w": "唐", "m": "内乱でほろびた中国の王朝", "q": "907年、内乱でおとろえてほろびた、長く栄えた中国の王朝を何というか。", "cf": [{"t": "宋", "m": "唐のあとに中国をまとめた王朝"}, {"t": "隋", "m": "唐の前に中国を統一した王朝"}]}, {"t": "高麗が朝鮮半島を統一", "ax": "wld", "y": 936, "d": "朝鮮半島に高麗がおこり、半島を統一した。", "w": "高麗", "m": "朝鮮半島を統一した国", "q": "936年、朝鮮半島を統一した国を何というか。", "cf": [{"t": "新羅", "m": "かつて朝鮮半島を統一した国"}]}, {"t": "宋がおこる", "ax": "wld", "y": 960, "d": "混乱をしずめて中国に宋がおこった。日本とは日宋貿易で結ばれた。", "w": "宋", "m": "唐のあとに中国をまとめた王朝", "q": "10世紀、唐のあとの混乱をしずめて中国をまとめ、のちに平清盛が貿易の相手とした王朝を何というか。", "cf": [{"t": "唐", "m": "宋の前に栄えた中国の王朝"}]}, {"t": "十字軍の遠征が始まる", "ax": "wld", "y": 1096, "d": "ヨーロッパのキリスト教徒が、聖地エルサレムの奪回をめざして遠征を始めた。", "w": "十字軍", "m": "聖地奪回をめざしたキリスト教徒の遠征軍", "q": "11世紀末、聖地エルサレムの奪回をめざして遠征を始めた、ヨーロッパのキリスト教徒の軍を何というか。"}], "muromachi": [{"t": "建武の新政（後醍醐天皇）", "ax": "pol", "y": 1334, "d": "鎌倉幕府をたおした後醍醐天皇が、天皇中心の政治を始める。しかし武士の不満が高まった。", "w": "建武の新政", "m": "後醍醐天皇による天皇中心の政治", "q": "鎌倉幕府をたおした後醍醐天皇が始めた、天皇中心の政治を何というか。", "cf": [{"t": "院政", "m": "上皇が天皇にかわって行った政治"}, {"t": "摂関政治", "m": "藤原氏が天皇を補佐して行った政治"}]}, {"t": "南北朝の対立が始まる", "ax": "pol", "y": 1336, "d": "足利尊氏が京都に別の天皇（北朝）を立て、吉野の後醍醐天皇（南朝）と対立。全国が二つに分かれて争う。", "w": "南北朝の対立", "m": "京都の北朝と吉野の南朝が争った対立", "q": "足利尊氏が立てた北朝と、後醍醐天皇の南朝が全国で争った対立を何というか。"}, {"t": "足利尊氏、征夷大将軍に", "ax": "pol", "y": 1338, "d": "尊氏が征夷大将軍となり、京都に室町幕府を開く。", "w": "足利尊氏", "m": "室町幕府を開いた初代将軍", "q": "1338年に征夷大将軍となり、京都に室町幕府を開いた人物はだれか。", "cf": [{"t": "足利義満", "m": "南北朝を統一した室町幕府3代将軍"}, {"t": "足利義政", "m": "銀閣を建てた室町幕府8代将軍"}]}, {"t": "守護大名の成長", "ax": "pol", "y": 1370, "d": "守護が任国の武士をまとめ、領地を支配する守護大名へと成長していく。", "w": "守護大名", "m": "任国の武士を従えて領地を支配した守護", "q": "室町時代、任国の武士をまとめて領地を支配するようになった守護を何というか。", "cf": [{"t": "戦国大名", "m": "実力で領国を支配した大名"}, {"t": "守護", "m": "鎌倉幕府が国ごとに置いた軍事・警察の役"}]}, {"t": "南北朝の統一（足利義満）", "ax": "pol", "y": 1392, "d": "3代将軍足利義満が南朝と北朝を一つにまとめ、幕府の力が最も強くなる。", "w": "足利義満", "m": "南北朝を統一した室町幕府3代将軍", "q": "1392年に南朝と北朝を一つにまとめた室町幕府の3代将軍はだれか。", "cf": [{"t": "足利尊氏", "m": "室町幕府を開いた初代将軍"}]}, {"t": "下剋上と戦国大名", "ax": "pol", "y": 1500, "d": "実力のある者が上の者をたおす下剋上が広がり、各地に戦国大名が登場する。", "w": "下剋上", "m": "下の身分の者が上の者をたおす風潮", "q": "実力のある下の者が上の者をたおす、戦国時代に広がった風潮を何というか。", "cf": [{"t": "戦国大名", "m": "実力で領国を支配した大名"}]}, {"t": "室町幕府の滅亡", "ax": "pol", "y": 1573, "d": "織田信長が15代将軍足利義昭を京都から追放し、室町幕府がほろびる。", "w": "室町幕府の滅亡", "m": "信長が足利義昭を追放し幕府が終わったこと", "q": "1573年、織田信長が15代将軍足利義昭を京都から追放して起きた出来事を何というか。", "cf": [{"t": "足利義昭", "m": "信長に追放された室町幕府最後の将軍"}]}, {"t": "南北朝の内乱", "ax": "war", "y": 1350, "d": "南朝と北朝に分かれ、各地で武士どうしの戦いが約60年続く。", "w": "南北朝の内乱", "m": "南朝と北朝が約60年続けた戦い", "q": "南朝と北朝に分かれて約60年続いた武士どうしの戦いを何というか。", "cf": [{"t": "応仁の乱", "m": "将軍のあとつぎ争いから起きた戦乱"}]}, {"t": "倭寇の活動", "ax": "war", "y": 1370, "d": "日本人などの海賊（倭寇）が朝鮮・中国の沿岸をおそい、取りしまりが求められた。", "w": "倭寇", "m": "朝鮮・中国の沿岸をおそった海賊", "q": "室町時代、朝鮮や中国の沿岸をおそった日本人などの海賊を何というか。", "cf": [{"t": "勘合貿易", "m": "合い札で区別して行った明との貿易"}]}, {"t": "勘合貿易（日明貿易）の開始", "ax": "war", "y": 1404, "d": "足利義満が明と国交を開き、正式な船に勘合という合い札を持たせて倭寇と区別し、貿易を行った。", "w": "勘合貿易", "m": "合い札で倭寇と区別した明との貿易", "q": "足利義満が始めた、正式な船に合い札を持たせて倭寇と区別した明との貿易を何というか。", "cf": [{"t": "日宋貿易", "m": "平清盛が進めた宋との貿易"}, {"t": "倭寇", "m": "朝鮮・中国の沿岸をおそった海賊"}]}, {"t": "琉球王国の成立", "ax": "war", "y": 1429, "d": "沖縄で尚氏が統一し琉球王国を建てる。東アジアを結ぶ中継貿易で栄えた。", "w": "琉球王国", "m": "尚氏が沖縄を統一し中継貿易で栄えた国", "q": "1429年に尚氏が沖縄を統一して建て、中継貿易で栄えた国を何というか。"}, {"t": "応仁の乱", "ax": "war", "y": 1467, "d": "8代将軍足利義政のあとつぎ争いなどから、有力な守護大名が二手に分かれて京都で戦う。約11年続き、都は荒れはてた。", "w": "応仁の乱", "m": "将軍のあとつぎ争いから起きた戦乱", "q": "1467年、8代将軍足利義政のあとつぎ争いから有力な守護大名が京都で戦った戦乱を何というか。", "cf": [{"t": "承久の乱", "m": "後鳥羽上皇が幕府をたおそうと起こした戦い"}, {"t": "南北朝の内乱", "m": "南朝と北朝が約60年続けた戦い"}]}, {"t": "鉄砲の伝来（種子島）", "ax": "war", "y": 1543, "d": "ポルトガル人を乗せた船が種子島に流れ着き、鉄砲が伝わる。戦い方や城づくりが変わっていく。", "w": "鉄砲", "m": "ポルトガル人が種子島に伝えた武器", "q": "1543年、種子島に流れ着いたポルトガル人が伝えた武器を何というか。", "cf": [{"t": "キリスト教の伝来", "m": "ザビエルが日本に伝えたキリスト教"}]}, {"t": "キリスト教の伝来（ザビエル）", "ax": "war", "y": 1549, "d": "イエズス会の宣教師フランシスコ＝ザビエルが来日し、キリスト教を伝える。", "w": "ザビエル", "m": "日本にキリスト教を伝えた宣教師", "q": "1549年に来日し、日本にキリスト教を伝えたイエズス会の宣教師はだれか。", "cf": [{"t": "鉄砲", "m": "種子島に伝わった武器"}]}, {"t": "農業の発達", "ax": "eco", "y": 1400, "d": "二毛作が広まり、水車や肥料の工夫も進んで生産力が上がる。", "w": "二毛作", "m": "同じ田畑で米と麦を1年に作ること", "q": "室町時代に広まった、同じ田畑で1年に米と麦など2種類の作物を作る方法を何というか。"}, {"t": "座の発達", "ax": "eco", "y": 1410, "d": "商人や手工業者が座という組合をつくり、公家や寺社の保護を受けて営業を独占した。", "w": "座", "m": "営業を独占した商工業者の組合", "q": "室町時代、商人や手工業者が公家・寺社の保護を受けて営業を独占した組合を何というか。", "cf": [{"t": "楽市・楽座", "m": "織田信長が市の税や座を廃した政策"}]}, {"t": "惣（村の自治）", "ax": "eco", "y": 1420, "d": "有力な農民が中心となり、村（惣）を寄合で運営するようになる。", "w": "惣", "m": "農民が寄合で自治を行った村", "q": "室町時代、有力な農民が中心となり寄合で運営した自治的な村を何というか。"}, {"t": "明銭の流通", "ax": "eco", "y": 1425, "d": "日明貿易で入った明銭（永楽通宝）が広く使われ、貨幣による取り引きが進む。", "w": "永楽通宝", "m": "日明貿易で輸入され広く使われた明の銅銭", "q": "日明貿易で日本に入り、広く使われた明の銅銭を何というか。"}, {"t": "正長の土一揆", "ax": "eco", "y": 1428, "d": "近江の馬借をきっかけに、農民らが借金の帳消し（徳政）を求めて土倉・酒屋をおそった。", "w": "正長の土一揆", "m": "徳政を求めて起こった初の土一揆", "q": "1428年、近江の馬借をきっかけに農民らが借金の帳消しを求めて起こした一揆を何というか。", "cf": [{"t": "徳政令", "m": "借金の帳消しを認める命令"}]}, {"t": "土倉・酒屋（金融業）", "ax": "eco", "y": 1445, "d": "お金を貸す土倉や酒屋が高利貸として栄え、幕府も税をかけた。", "w": "土倉・酒屋", "m": "お金を貸した高利貸しの金融業者", "q": "室町時代、お金を貸して高利貸しとして栄え、幕府も税をかけた金融業者を何というか。"}, {"t": "都市の発展（堺・博多）", "ax": "eco", "y": 1500, "d": "貿易で栄えた堺や博多では、有力な商人（町衆）が自治を行った。", "w": "町衆", "m": "都市で自治を行った有力な商人", "q": "堺や博多などの都市で、自治を行った有力な商人を何というか。"}, {"t": "金閣（北山文化・足利義満）", "ax": "cul", "y": 1397, "d": "義満が京都の北山に建てた金色の建物。公家と武家の文化が混じった北山文化を代表する。", "w": "金閣", "m": "義満が北山に建てた金色の建物", "q": "足利義満が京都の北山に建てた、北山文化を代表する金色の建物を何というか。", "cf": [{"t": "銀閣", "m": "足利義政が東山に建てた建物"}]}, {"t": "能楽（観阿弥・世阿弥）", "ax": "cul", "y": 1400, "d": "義満の保護を受け、観阿弥・世阿弥の父子が能楽を大成した。", "w": "能楽", "m": "観阿弥・世阿弥が大成した舞台芸能", "q": "足利義満の保護を受け、観阿弥・世阿弥の父子が大成した舞台芸能を何というか。"}, {"t": "庶民の文化（御伽草子・茶の湯）", "ax": "cul", "y": 1460, "d": "御伽草子や連歌、茶の湯・生け花など、武士や庶民にも文化が広がる。", "w": "御伽草子", "m": "庶民に親しまれた絵入りの物語", "q": "室町時代、庶民に親しまれた「一寸法師」などの絵入りの物語を何というか。"}, {"t": "水墨画（雪舟）", "ax": "cul", "y": 1470, "d": "明で学んだ雪舟が、墨の濃淡で描く水墨画を日本で大成した。", "w": "雪舟", "m": "水墨画を日本で大成した画僧", "q": "明で学び、墨の濃淡で描く絵を日本で大成した人物はだれか。"}, {"t": "書院造", "ax": "cul", "y": 1485, "d": "たたみ・障子・床の間をもつ書院造が生まれる。今の和室のもとになった。", "w": "書院造", "m": "床の間や障子をもつ和室のもとの建築", "q": "たたみ・障子・床の間をもち、今の和室のもとになった室町時代の建築様式を何というか。", "cf": [{"t": "寝殿造", "m": "平安時代の貴族の住宅様式"}]}, {"t": "銀閣（東山文化・足利義政）", "ax": "cul", "y": 1489, "d": "8代将軍義政が京都の東山に建てた。しずかで気品のある東山文化を代表する。", "w": "銀閣", "m": "義政が東山に建てた建物", "q": "8代将軍足利義政が京都の東山に建てた、東山文化を代表する建物を何というか。", "cf": [{"t": "金閣", "m": "足利義満が北山に建てた金色の建物"}]}, {"t": "枯山水（龍安寺石庭）", "ax": "cul", "y": 1490, "d": "水を使わず、石と砂で自然を表す庭。禅の考えを反映している。", "w": "枯山水", "m": "石と砂で自然を表す庭", "q": "水を使わず、石と砂で自然を表した禅の考えを反映する庭を何というか。"}, {"t": "明がおこる（元の滅亡）", "ax": "wld", "y": 1368, "d": "漢民族が元を北へ追い、中国に明をたてた。", "w": "明", "m": "漢民族が元をたおして建てた中国の王朝", "q": "1368年、漢民族が元を北へ追って中国に建てた王朝を何というか。", "cf": [{"t": "元", "m": "モンゴル民族が中国に建てた王朝"}]}, {"t": "朝鮮国（李氏朝鮮）の成立", "ax": "wld", "y": 1392, "d": "高麗にかわって朝鮮国がおこり、のちにハングルもつくられた。", "w": "朝鮮国", "m": "高麗にかわっておこった国（ハングルを作る）", "q": "1392年、高麗にかわっておこり、のちにハングルをつくった国を何というか。", "cf": [{"t": "高麗", "m": "朝鮮国の前にあった国"}]}, {"t": "ルネサンスが始まる", "ax": "wld", "y": 1400, "d": "イタリアで古代の文化を見直すルネサンスがおこり、ヨーロッパに広まった（14〜16世紀）。", "w": "ルネサンス", "m": "古代の文化を見直す文化運動", "q": "14〜16世紀、イタリアから始まった古代の文化を見直す動きを何というか。", "cf": [{"t": "宗教改革", "m": "ルターがカトリック教会を批判した動き"}]}, {"t": "コロンブスが大西洋をわたる", "ax": "wld", "y": 1492, "d": "スペインの援助を受けたコロンブスが、西インド諸島に到達した。", "w": "コロンブス", "m": "西インド諸島に到達した航海者", "q": "スペインの援助を受け、大西洋をわたって西インド諸島に到達した人物はだれか。", "cf": [{"t": "バスコ＝ダ＝ガマ", "m": "インドへの航路を開いた人物"}, {"t": "マゼラン", "m": "世界一周を成しとげた船隊の指揮者"}]}, {"t": "バスコ＝ダ＝ガマのインド航路", "ax": "wld", "y": 1498, "d": "アフリカ南端を回り、ヨーロッパからインドへの航路が開かれた。", "w": "バスコ＝ダ＝ガマ", "m": "インドへの航路を開いた航海者", "q": "アフリカ南端を回り、ヨーロッパからインドへの航路を開いた人物はだれか。", "cf": [{"t": "コロンブス", "m": "西インド諸島に到達した人物"}]}], "sengoku": [{"t": "戦国大名の登場（下剋上）", "ax": "pol", "y": 1500, "d": "実力で領国を支配する戦国大名が各地に現れる。独自の分国法で領地を治めた。", "w": "戦国大名", "m": "実力で領国を支配した大名", "q": "戦国時代、実力で領国を支配し、独自の分国法で領地を治めた大名を何というか。", "cf": [{"t": "守護大名", "m": "任国の武士を従えて領地を支配した守護"}, {"t": "分国法", "m": "戦国大名が領国を治めるために定めた法"}]}, {"t": "織田信長、室町幕府をほろぼす", "ax": "pol", "y": 1573, "d": "15代将軍足利義昭を京都から追放し、全国統一へと乗り出す。", "w": "織田信長", "m": "室町幕府をほろぼし全国統一を進めた武将", "q": "1573年に足利義昭を追放して室町幕府をほろぼした武将はだれか。", "cf": [{"t": "豊臣秀吉", "m": "信長の後をつぎ全国統一を果たした武将"}]}, {"t": "豊臣秀吉が信長の後をつぐ", "ax": "pol", "y": 1583, "d": "本能寺の変のあと明智光秀をたおし、大阪城を築いて統一事業を引きつぐ。", "w": "豊臣秀吉", "m": "信長の後をつぎ天下統一を進めた武将", "q": "本能寺の変のあと明智光秀をたおし、大阪城を築いて統一事業を引きついだ武将はだれか。", "cf": [{"t": "織田信長", "m": "室町幕府をほろぼした武将"}, {"t": "徳川家康", "m": "江戸幕府を開いた武将"}]}, {"t": "豊臣秀吉の全国統一", "ax": "pol", "y": 1590, "d": "小田原の北条氏をほろぼし、全国の大名を従えて天下統一を果たす。", "w": "天下統一", "m": "全国の大名を従えて日本を一つにまとめたこと", "q": "1590年、豊臣秀吉が小田原の北条氏をほろぼして成しとげたことを何というか。"}, {"t": "徳川家康、征夷大将軍に（江戸幕府）", "ax": "pol", "y": 1603, "d": "関ヶ原の戦いに勝った家康が征夷大将軍となり、江戸に幕府を開く。", "w": "徳川家康", "m": "江戸幕府を開いた初代将軍", "q": "1603年に征夷大将軍となり、江戸に幕府を開いた人物はだれか。", "cf": [{"t": "豊臣秀吉", "m": "家康の前に天下統一を果たした武将"}]}, {"t": "応仁の乱", "ax": "war", "y": 1467, "d": "将軍のあとつぎ争いから守護大名が二手に分かれて京都で戦う。幕府の力が衰え、戦国の世が始まる。", "w": "応仁の乱", "m": "将軍のあとつぎ争いから起きた戦乱", "q": "1467年、将軍のあとつぎ争いから守護大名が京都で戦い、戦国の世のきっかけとなった戦乱を何というか。", "cf": [{"t": "承久の乱", "m": "後鳥羽上皇が幕府をたおそうと起こした戦い"}]}, {"t": "ポルトガル・スペインのアジア進出", "ax": "wld", "y": 1540, "d": "大航海時代、新しい航路を開いたポルトガルとスペインがアジアへ進出。やがて日本にも来航するようになる。", "w": "大航海時代", "m": "ヨーロッパが新航路を開き世界に進出した時代", "q": "ポルトガルやスペインが新しい航路を開いてアジアなどへ進出した時代を何というか。"}, {"t": "鉄砲の伝来（種子島）", "ax": "war", "y": 1543, "d": "種子島に流れ着いたポルトガル人によって鉄砲が伝わる。戦い方や城づくりが変わっていく。", "w": "鉄砲", "m": "ポルトガル人が種子島に伝えた武器", "q": "1543年、種子島に流れ着いたポルトガル人が伝えた武器を何というか。", "cf": [{"t": "キリスト教の伝来", "m": "ザビエルが日本に伝えたキリスト教"}]}, {"t": "キリスト教の伝来（ザビエル）", "ax": "war", "y": 1549, "d": "スペイン出身のイエズス会宣教師フランシスコ＝ザビエルが来日し、キリスト教を伝える。", "w": "ザビエル", "m": "日本にキリスト教を伝えた宣教師", "q": "1549年に来日し、日本にキリスト教を伝えたイエズス会の宣教師はだれか。", "cf": [{"t": "鉄砲", "m": "種子島に伝わった武器"}]}, {"t": "桶狭間の戦い", "ax": "war", "y": 1560, "d": "尾張の織田信長が、大軍の今川義元をやぶって一気に名を上げる。", "w": "桶狭間の戦い", "m": "信長が今川義元をやぶった戦い", "q": "1560年、尾張の織田信長が大軍の今川義元をやぶった戦いを何というか。", "cf": [{"t": "長篠の戦い", "m": "信長・家康が鉄砲で武田氏をやぶった戦い"}]}, {"t": "長篠の戦い", "ax": "war", "y": 1575, "d": "信長・徳川家康が、鉄砲を大量に使って武田氏の騎馬隊をやぶる。", "w": "長篠の戦い", "m": "鉄砲を使って武田氏をやぶった戦い", "q": "1575年、信長・徳川家康が鉄砲を大量に使って武田氏の騎馬隊をやぶった戦いを何というか。", "cf": [{"t": "桶狭間の戦い", "m": "信長が今川義元をやぶった戦い"}]}, {"t": "本能寺の変", "ax": "war", "y": 1582, "d": "家臣の明智光秀にそむかれ、統一目前の織田信長が京都で自害する。", "w": "本能寺の変", "m": "信長が明智光秀にそむかれ自害した事件", "q": "1582年、家臣の明智光秀にそむかれ、統一目前の織田信長が京都で自害した事件を何というか。"}, {"t": "バテレン追放令", "ax": "war", "y": 1587, "d": "秀吉がキリスト教の宣教師を追放するよう命じる。ただし貿易は続けたため不徹底に終わった。", "w": "バテレン追放令", "m": "秀吉がキリスト教の宣教師を追放させた命令", "q": "1587年、豊臣秀吉がキリスト教の宣教師を追放するよう命じたものを何というか。"}, {"t": "朝鮮出兵（文禄・慶長の役）", "ax": "war", "y": 1592, "d": "秀吉が明の征服をめざして二度朝鮮に出兵。大名や農民の負担が重くなった。", "w": "朝鮮出兵", "m": "秀吉が明の征服をめざし朝鮮に二度出兵したこと", "q": "豊臣秀吉が明の征服をめざして二度にわたり朝鮮に兵を送ったことを何というか。"}, {"t": "関ヶ原の戦い", "ax": "war", "y": 1600, "d": "徳川家康が石田三成らをやぶり、天下の実権をにぎる。", "w": "関ヶ原の戦い", "m": "家康が石田三成らをやぶった戦い", "q": "1600年、徳川家康が石田三成らをやぶり天下の実権をにぎった戦いを何というか。"}, {"t": "オランダ船リーフデ号の漂着", "ax": "war", "y": 1600, "d": "オランダ船リーフデ号が豊後（大分）に漂着。乗組員のウィリアム＝アダムス（三浦按針）らが家康に仕え、のちのオランダ・イギリスとの貿易につながった。ポルトガル・スペイン（南蛮人）に対し、オランダ・イギリスは紅毛人とよばれた。", "w": "リーフデ号", "m": "豊後に漂着したオランダ船", "q": "1600年に豊後（大分）に漂着し、乗組員が家康に仕えたオランダ船を何というか。"}, {"t": "鉱山の開発（石見銀山）", "ax": "eco", "y": 1550, "d": "石見銀山などで銀の生産が増え、南蛮貿易などに使われた。", "w": "石見銀山", "m": "多くの銀を産出した鉱山", "q": "戦国時代に銀の生産が増え、南蛮貿易などに使われた島根県の鉱山を何というか。"}, {"t": "南蛮貿易（ポルトガル・スペイン）", "ax": "eco", "y": 1570, "d": "ポルトガル・スペイン（南蛮人）との貿易で、鉄砲・火薬・生糸・時計などが輸入され、日本からは主に銀が輸出された。", "w": "南蛮貿易", "m": "ポルトガル・スペインとの貿易", "q": "ポルトガル・スペイン（南蛮人）と行い、鉄砲や生糸を輸入して銀を輸出した貿易を何というか。", "cf": [{"t": "勘合貿易", "m": "足利義満が始めた明との貿易"}]}, {"t": "楽市・楽座（織田信長）", "ax": "eco", "y": 1577, "d": "座をなくし関所を廃止して、だれでも自由に商売できるようにし、城下町を栄えさせた。", "w": "楽市・楽座", "m": "信長が座や税をなくし商売を自由にした政策", "q": "織田信長が座をなくし関所を廃して、だれでも自由に商売できるようにした政策を何というか。", "cf": [{"t": "座", "m": "営業を独占した商工業者の組合"}, {"t": "定期市", "m": "鎌倉・室町時代に月数回開かれた市"}]}, {"t": "太閤検地（豊臣秀吉）", "ax": "eco", "y": 1584, "d": "全国の田畑を調べ、土地のよしあしや収穫量を石高で表して統一した。", "w": "太閤検地", "m": "全国の田畑を調べ石高で表した政策", "q": "豊臣秀吉が全国の田畑を調べ、収穫量を石高で表して統一した政策を何というか。", "cf": [{"t": "刀狩", "m": "農民から武器を取り上げた政策"}, {"t": "地租改正", "m": "明治政府が地価を基準に税を定めた改革"}]}, {"t": "刀狩（豊臣秀吉）", "ax": "eco", "y": 1588, "d": "一揆を防ぐため、農民から刀や鉄砲などの武器を取り上げた。", "w": "刀狩", "m": "農民から武器を取り上げた政策", "q": "1588年、豊臣秀吉が一揆を防ぐため農民から武器を取り上げた政策を何というか。", "cf": [{"t": "太閤検地", "m": "全国の田畑を調べ石高で表した政策"}]}, {"t": "兵農分離", "ax": "eco", "y": 1590, "d": "検地と刀狩によって、武士と農民の身分がはっきりと分けられた。", "w": "兵農分離", "m": "武士と農民の身分をはっきり分けたこと", "q": "検地と刀狩によって、武士と農民の身分がはっきり分けられたことを何というか。"}, {"t": "安土城（天守閣）", "ax": "cul", "y": 1576, "d": "信長が築いた壮大な城。高い天守閣をもつ城づくりの先がけとなった。", "w": "安土城", "m": "信長が築いた天守閣をもつ城", "q": "織田信長が築いた、高い天守閣をもつ城づくりの先がけとなった城を何というか。", "cf": [{"t": "姫路城", "m": "白い壁の美しい天守閣をもつ城"}]}, {"t": "南蛮文化", "ax": "cul", "y": 1580, "d": "キリスト教とともに、活版印刷・天文学・医学や、パン・カステラ・時計などが伝わった。", "w": "南蛮文化", "m": "南蛮人がキリスト教とともに伝えた文化", "q": "キリスト教とともに活版印刷や天文学、カステラなどが伝わった文化を何というか。"}, {"t": "狩野永徳（障壁画・屏風）", "ax": "cul", "y": 1585, "d": "金地に力強くえがくきらびやかな障壁画・屏風絵で、桃山文化を代表した。", "w": "狩野永徳", "m": "桃山文化を代表する画家", "q": "金地に力強くえがくきらびやかな障壁画・屏風絵で桃山文化を代表した画家はだれか。", "cf": [{"t": "雪舟", "m": "水墨画を大成した画僧"}]}, {"t": "千利休（わび茶）", "ax": "cul", "y": 1587, "d": "質素なおもむきを大切にするわび茶（茶の湯）を大成した。", "w": "千利休", "m": "わび茶を大成した人物", "q": "質素なおもむきを大切にするわび茶（茶の湯）を大成した人物はだれか。"}, {"t": "姫路城（白鷺城）", "ax": "cul", "y": 1595, "d": "白い壁の美しい天守閣をもつ城。桃山文化の城郭建築を代表する。", "w": "姫路城", "m": "白い壁の美しい天守閣をもつ城", "q": "白い壁の美しい天守閣をもち、桃山文化の城郭建築を代表する城を何というか。", "cf": [{"t": "安土城", "m": "信長が築いた城"}]}, {"t": "出雲の阿国（かぶきおどり）", "ax": "cul", "y": 1600, "d": "出雲の阿国が始めたかぶきおどりが人気を集め、のちの歌舞伎のもとになった。", "w": "出雲の阿国", "m": "かぶきおどりを始めた女性", "q": "かぶきおどりを始め、のちの歌舞伎のもとをつくった女性はだれか。"}, {"t": "コロンブスが大西洋をわたる", "ax": "wld", "y": 1492, "d": "西インド諸島に到達し、ヨーロッパの大航海時代が本格化した。", "w": "コロンブス", "m": "西インド諸島に到達した航海者", "q": "1492年、大西洋をわたって西インド諸島に到達し、大航海時代を本格化させた人物はだれか。", "cf": [{"t": "マゼラン", "m": "世界一周を成しとげた船隊の指揮者"}]}, {"t": "宗教改革が始まる（ルター）", "ax": "wld", "y": 1517, "d": "ドイツのルターがカトリック教会を批判し、プロテスタントがおこった。", "w": "宗教改革", "m": "ルターがカトリック教会を批判した動き", "q": "1517年、ドイツのルターがカトリック教会を批判して始めた動きを何というか。", "cf": [{"t": "ルネサンス", "m": "古代の文化を見直した文化運動"}]}, {"t": "マゼラン一行が世界一周", "ax": "wld", "y": 1522, "d": "マゼランの船隊が初めて世界一周を成しとげ、地球が丸いことを示した。", "w": "マゼラン", "m": "初めて世界一周を成しとげた船隊の指揮者", "q": "船隊を率いて初めて世界一周を成しとげ、地球が丸いことを示した人物はだれか。"}], "edo": [{"t": "徳川家康、江戸幕府を開く", "ax": "pol", "y": 1603, "d": "征夷大将軍となった家康が江戸に幕府を開く。全国の大名を支配する幕藩体制が始まる。", "w": "徳川家康", "m": "江戸幕府を開いた初代将軍", "q": "1603年に征夷大将軍となり江戸幕府を開いた人物はだれか。"}, {"t": "武家諸法度", "ax": "pol", "y": 1615, "d": "大名を統制するための決まり。城の修理や結婚も幕府の許可が必要になった。", "w": "武家諸法度", "m": "幕府が大名を統制するために定めた法", "q": "江戸幕府が大名を統制するために定めた法を何というか。", "cf": [{"t": "御成敗式目", "m": "鎌倉時代に北条泰時が定めた武家初の法"}]}, {"t": "参勤交代の制度化（徳川家光）", "ax": "pol", "y": 1635, "d": "大名に領地と江戸を1年おきに往復させる。大名は大きな出費を強いられた。", "w": "参勤交代", "m": "大名に江戸と領地を1年おきに往復させる制度", "q": "徳川家光が制度化した、大名に江戸と領地を1年おきに往復させるきまりを何というか。"}, {"t": "享保の改革（徳川吉宗）", "ax": "pol", "y": 1716, "d": "質素倹約・新田開発・目安箱・公事方御定書などで、幕府の財政を立て直そうとした。", "w": "享保の改革", "m": "徳川吉宗が行った幕府財政の立て直し", "q": "徳川吉宗が行った、質素倹約や目安箱などの幕政改革を何というか。", "cf": [{"t": "寛政の改革", "m": "松平定信が行った改革"}, {"t": "天保の改革", "m": "水野忠邦が行った改革"}]}, {"t": "田沼意次の政治", "ax": "pol", "y": 1772, "d": "株仲間を公認し商業から利益を得ようとしたが、わいろが横行して批判された。", "w": "田沼意次", "m": "株仲間を公認し商業を重視した老中", "q": "株仲間を公認し、商業の利益で財政を立て直そうとした老中はだれか。"}, {"t": "寛政の改革（松平定信）", "ax": "pol", "y": 1787, "d": "ききんに備えて米をたくわえさせ、質素倹約と学問の統制を進めた。", "w": "寛政の改革", "m": "松平定信が行った質素倹約・学問統制の改革", "q": "松平定信が行った、米の備蓄や学問の統制を進めた幕政改革を何というか。", "cf": [{"t": "享保の改革", "m": "徳川吉宗が行った改革"}, {"t": "天保の改革", "m": "水野忠邦が行った改革"}]}, {"t": "天保の改革（水野忠邦）", "ax": "pol", "y": 1841, "d": "株仲間の解散や倹約令などを行ったが、大名や商人の反発で2年ほどで失敗した。", "w": "天保の改革", "m": "水野忠邦が行い短期間で失敗した改革", "q": "水野忠邦が行った、株仲間の解散などを進めたが失敗した幕政改革を何というか。", "cf": [{"t": "享保の改革", "m": "徳川吉宗が行った改革"}, {"t": "寛政の改革", "m": "松平定信が行った改革"}]}, {"t": "大政奉還（徳川慶喜）", "ax": "pol", "y": 1867, "d": "15代将軍徳川慶喜が政権を朝廷に返し、約260年続いた江戸幕府が終わった。", "w": "大政奉還", "m": "将軍が政権を朝廷に返したこと", "q": "1867年に徳川慶喜が政権を朝廷に返したできごとを何というか。"}, {"t": "島原・天草一揆", "ax": "war", "y": 1637, "d": "重い年貢とキリスト教の禁止に苦しむ人々が、天草四郎を大将に一揆を起こした。", "w": "島原・天草一揆", "m": "天草四郎を大将にキリシタンらが起こした一揆", "q": "1637年、重い年貢とキリスト教弾圧に苦しむ人々が天草四郎を大将に起こした一揆を何というか。"}, {"t": "鎖国の完成", "ax": "war", "y": 1641, "d": "キリスト教を防ぐため貿易を制限。長崎（オランダ・中国）・対馬（朝鮮）・薩摩（琉球）・松前（アイヌ）の4つの窓口だけが開かれた。", "w": "鎖国", "m": "キリスト教を防ぐため貿易を制限した体制", "q": "キリスト教を防ぐため、幕府が貿易を制限し外交を独占した体制を何というか。"}, {"t": "朝鮮通信使", "ax": "war", "y": 1710, "d": "将軍の代がわりごとに、朝鮮から友好の使節（通信使）が江戸を訪れた。", "w": "朝鮮通信使", "m": "将軍の代がわりごとに朝鮮から来た使節", "q": "将軍の代がわりごとに、朝鮮から友好のために送られた使節を何というか。"}, {"t": "ラクスマンの来航（ロシア）", "ax": "war", "y": 1792, "d": "ロシアの使節ラクスマンが根室に来て通商を求める。外国船の接近が増え始める。", "w": "ラクスマン", "m": "根室に来て通商を求めたロシアの使節", "q": "1792年に根室に来航し、日本に通商を求めたロシアの使節はだれか。"}, {"t": "異国船打払令", "ax": "war", "y": 1825, "d": "近づく外国船を追い払うよう命じる。清がアヘン戦争で敗れると、幕府は方針をゆるめた。", "w": "異国船打払令", "m": "近づく外国船を追い払うよう命じた法令", "q": "近づく外国船を追い払うよう幕府が命じた法令を何というか。"}, {"t": "ペリーの来航（浦賀）", "ax": "war", "y": 1853, "d": "アメリカのペリーが軍艦で浦賀に来航し、開国を強く求めた。", "w": "ペリー", "m": "浦賀に来航し開国を求めたアメリカの軍人", "q": "1853年に軍艦で浦賀に来航し、日本に開国を求めたアメリカの人物はだれか。"}, {"t": "日米和親条約（開国）", "ax": "war", "y": 1854, "d": "下田・函館の2港を開き、200年あまり続いた鎖国が終わる。", "w": "日米和親条約", "m": "下田・函館を開き鎖国が終わった条約", "q": "1854年に下田・函館の2港を開き、鎖国が終わるきっかけとなった条約を何というか。", "cf": [{"t": "日米修好通商条約", "m": "1858年に結んだ、貿易を認めた不平等条約"}]}, {"t": "日米修好通商条約", "ax": "war", "y": 1858, "d": "大老井伊直弼が結んだ。領事裁判権を認め、関税自主権がない不平等な条約だった。", "w": "日米修好通商条約", "m": "井伊直弼が結んだ不平等な通商条約", "q": "1858年に大老井伊直弼が結んだ、領事裁判権を認め関税自主権のない条約を何というか。", "cf": [{"t": "日米和親条約", "m": "1854年に下田・函館を開いた条約"}]}, {"t": "新田開発と農業の改良", "ax": "eco", "y": 1650, "d": "新田開発が進み、備中ぐわ・千歯こきなどの農具で生産力が上がった。", "w": "新田開発", "m": "用水路などを整え田畑を新たに開くこと", "q": "江戸時代に幕府や藩が進めた、新しく田畑を開く事業を何というか。", "cf": [{"t": "千歯こき", "m": "脱穀を効率化した農具"}, {"t": "備中ぐわ", "m": "深く耕すための農具"}]}, {"t": "交通の整備（五街道・航路）", "ax": "eco", "y": 1670, "d": "五街道や東廻り・西廻り航路が整い、物資や人が全国を行き交うようになった。", "w": "五街道", "m": "江戸を起点に整えられた5本の主要道路", "q": "江戸を起点として整えられた、東海道などの5本の主要な道路をまとめて何というか。"}, {"t": "大阪「天下の台所」", "ax": "eco", "y": 1700, "d": "諸藩が蔵屋敷を置き、大阪が全国の商業の中心として栄えた。江戸・京都と合わせて三都という。", "w": "天下の台所", "m": "商業の中心として栄えた大阪の呼び名", "q": "諸藩の蔵屋敷が置かれ、全国の商業の中心として栄えた大阪の呼び名を何というか。", "cf": [{"t": "三都", "m": "江戸・大阪・京都のこと"}]}, {"t": "株仲間の発達", "ax": "eco", "y": 1775, "d": "商人が株仲間という組合をつくり、幕府に税を納めて営業を独占した。", "w": "株仲間", "m": "税を納め営業を独占した商人の同業組合", "q": "幕府に税を納め、営業を独占する特権を得た商人の同業組合を何というか。"}, {"t": "百姓一揆・打ちこわし", "ax": "eco", "y": 1780, "d": "重い年貢やききんに苦しむ百姓の一揆、都市の打ちこわしが各地で増えた。", "w": "百姓一揆", "m": "重い年貢やききんに苦しむ百姓の集団抵抗", "q": "重い年貢やききんに苦しむ百姓が、集団で領主に要求を訴えた行動を何というか。", "cf": [{"t": "打ちこわし", "m": "都市で米を買い占めた商人などをおそう行動"}]}, {"t": "工場制手工業（マニュファクチュア）", "ax": "eco", "y": 1830, "d": "地主や商人が人を集め、作業を分担して品物をつくるしくみが生まれた。", "w": "工場制手工業", "m": "人を集め分業で品物をつくるしくみ", "q": "地主や商人が働き手を集め、作業を分担して製品をつくったしくみを何というか。"}, {"t": "大塩の乱", "ax": "eco", "y": 1837, "d": "ききんに苦しむ人々を救うため、元幕府の役人大塩平八郎が大阪で兵を挙げた。", "w": "大塩平八郎", "m": "ききん救済のため大阪で挙兵した元役人", "q": "1837年、ききんに苦しむ人々を救うため大阪で乱を起こした元幕府の役人はだれか。"}, {"t": "井原西鶴（浮世草子）【元禄】", "ax": "cul", "y": 1682, "d": "町人の暮らしをいきいきとえがく浮世草子を書いた。上方中心の元禄文化を代表する。", "w": "井原西鶴", "m": "町人の生活をえがく浮世草子を書いた作家", "q": "元禄文化を代表し、町人の暮らしをえがいた浮世草子を書いた人物はだれか。"}, {"t": "松尾芭蕉（俳諧・奥の細道）【元禄】", "ax": "cul", "y": 1689, "d": "俳諧を芸術に高め、紀行文『おくのほそ道』を残した。", "w": "松尾芭蕉", "m": "俳諧を芸術に高め『おくのほそ道』を残した人", "q": "俳諧を芸術の域に高め、紀行文『おくのほそ道』を著した人物はだれか。"}, {"t": "菱川師宣（浮世絵）【元禄】", "ax": "cul", "y": 1690, "d": "「見返り美人図」などで知られ、浮世絵の祖とされる。", "w": "菱川師宣", "m": "「見返り美人図」で知られる浮世絵の祖", "q": "「見返り美人図」で知られ、浮世絵の祖とされる人物はだれか。"}, {"t": "近松門左衛門（人形浄瑠璃）【元禄】", "ax": "cul", "y": 1700, "d": "人形浄瑠璃や歌舞伎の脚本を書き、人々の心をえがいた。", "w": "近松門左衛門", "m": "人形浄瑠璃や歌舞伎の脚本を書いた作者", "q": "元禄文化で、人形浄瑠璃や歌舞伎の脚本を書いた人物はだれか。"}, {"t": "『解体新書』（杉田玄白）【蘭学】", "ax": "cul", "y": 1774, "d": "前野良沢らとオランダ語の医学書をほん訳。ヨーロッパの学問を学ぶ蘭学が発達した。", "w": "解体新書", "m": "杉田玄白らが訳したオランダ語の医学書", "q": "杉田玄白や前野良沢がオランダ語の医学書を訳して出した書物を何というか。", "cf": [{"t": "蘭学", "m": "オランダ語でヨーロッパの学問を学ぶ学問"}]}, {"t": "『古事記伝』（本居宣長）【国学】", "ax": "cul", "y": 1798, "d": "日本古来の考え方を研究する国学を大成。のちの尊王の考えにも影響した。", "w": "本居宣長", "m": "『古事記伝』を著し国学を大成した人物", "q": "『古事記伝』を著し、日本古来の考え方を研究する国学を大成した人物はだれか。", "cf": [{"t": "国学", "m": "日本古来の精神を明らかにしようとする学問"}]}, {"t": "化政文化の文学（十返舎一九・滝沢馬琴）", "ax": "cul", "y": 1810, "d": "江戸を中心に、こっけい本や読本など庶民の文学が広まった。", "w": "化政文化", "m": "江戸を中心に栄えた庶民の文化", "q": "19世紀初め、江戸を中心に庶民の間で栄えた文化を何というか。", "cf": [{"t": "元禄文化", "m": "上方を中心に栄えた町人文化"}]}, {"t": "葛飾北斎・歌川広重（風景の浮世絵）【化政】", "ax": "cul", "y": 1831, "d": "「富嶽三十六景」「東海道五十三次」など、多色刷りの風景版画（錦絵）が人気を集めた。", "w": "錦絵", "m": "多色刷りの浮世絵版画", "q": "化政文化のころ、葛飾北斎や歌川広重がえがいた多色刷りの浮世絵版画を何というか。"}, {"t": "明がほろび清がおこる", "ax": "wld", "y": 1644, "d": "満州族が明をほろぼし、中国に清をたてた。", "w": "清", "m": "満州族が中国にたてた王朝", "q": "17世紀に満州族が明をほろぼして中国にたてた王朝を何というか。"}, {"t": "名誉革命と権利章典（イギリス）", "ax": "wld", "y": 1689, "d": "国王の専制をおさえ、議会を尊重するしくみが確立した。", "w": "名誉革命", "m": "議会を尊重するしくみを確立したイギリスの革命", "q": "17世紀にイギリスで起き、権利章典で議会の尊重を確立した革命を何というか。", "cf": [{"t": "権利章典", "m": "名誉革命の後に出された議会尊重の文書"}]}, {"t": "産業革命が始まる（イギリス）", "ax": "wld", "y": 1770, "d": "機械と蒸気機関による生産が広まり、社会が大きく変わった（18世紀後半）。", "w": "産業革命", "m": "機械と蒸気機関による生産の大きな変化", "q": "18世紀後半のイギリスで始まった、機械と蒸気機関による社会の大きな変化を何というか。"}, {"t": "アメリカの独立宣言", "ax": "wld", "y": 1776, "d": "イギリスの植民地が独立を宣言し、自由・平等をうたった。", "w": "独立宣言", "m": "自由・平等をうたったアメリカの宣言", "q": "1776年にイギリスの植民地が出した、自由・平等をうたう宣言を何というか。"}, {"t": "フランス革命（人権宣言）", "ax": "wld", "y": 1789, "d": "市民が立ち上がり、自由・平等・国民主権をうたう人権宣言を出した。", "w": "フランス革命", "m": "自由・平等・国民主権をめざした市民革命", "q": "1789年、市民が立ち上がり人権宣言を出したフランスの革命を何というか。", "cf": [{"t": "人権宣言", "m": "フランス革命で出された自由・平等の宣言"}]}, {"t": "アヘン戦争（清の敗北）", "ax": "wld", "y": 1840, "d": "イギリスが清を破り、清は不平等な条約を結ばされた。", "w": "アヘン戦争", "m": "イギリスが清を破った戦争", "q": "1840年に始まり、イギリスが清を破って不平等条約を結ばせた戦争を何というか。"}, {"t": "アメリカ南北戦争", "ax": "wld", "y": 1861, "d": "奴隷制などをめぐる内戦。リンカンの指導で北部が勝利した。", "w": "南北戦争", "m": "奴隷制などをめぐるアメリカの内戦", "q": "リンカンの指導で北部が勝利した、アメリカの内戦を何というか。"}], "meiji": [{"t": "五箇条の御誓文（明治維新）", "ax": "pol", "y": 1868, "d": "新政府が政治の方針を示す。天皇中心の新しい国づくり（明治維新）が始まる。", "w": "五箇条の御誓文", "m": "新政府が示した政治の基本方針", "q": "1868年、新政府が天皇中心の新しい政治の方針を示したものを何というか。"}, {"t": "廃藩置県", "ax": "pol", "y": 1871, "d": "藩を廃止して県を置き、政府が任命した役人が治める。中央集権のしくみが整った。", "w": "廃藩置県", "m": "藩を廃し県を置いた中央集権の改革", "q": "藩を廃止して県を置き、中央集権のしくみを整えた改革を何というか。"}, {"t": "徴兵令（富国強兵）", "ax": "pol", "y": 1873, "d": "満20歳以上の男子に兵役の義務を課し、近代的な軍隊をつくった。学制・地租改正とならぶ明治の改革。", "w": "徴兵令", "m": "満20歳以上の男子に兵役を課した法令", "q": "満20歳以上の男子に兵役の義務を課した明治政府の法令を何というか。", "cf": [{"t": "学制", "m": "6歳以上の子に教育を受けさせる方針"}, {"t": "地租改正", "m": "地価を基準に現金で税を納めさせる改革"}]}, {"t": "民撰議院設立の建白書", "ax": "pol", "y": 1874, "d": "板垣退助らが国会の開設を求める。ここから自由民権運動が広がった。", "w": "民撰議院設立の建白書", "m": "板垣退助らが国会開設を求めた意見書", "q": "1874年に板垣退助らが政府に提出した、国会の開設を求める意見書を何というか。", "cf": [{"t": "自由民権運動", "m": "国会開設や憲法制定を求めた運動"}]}, {"t": "国会開設の勅諭", "ax": "pol", "y": 1881, "d": "政府が10年後の国会開設を約束。板垣退助が自由党をつくるなど政党も生まれた。", "w": "国会開設の勅諭", "m": "政府が10年後の国会開設を約束したもの", "q": "1881年、政府が10年後に国会を開くことを約束して出したものを何というか。"}, {"t": "内閣制度（伊藤博文）", "ax": "pol", "y": 1885, "d": "内閣制度がつくられ、伊藤博文が初代内閣総理大臣となった。", "w": "伊藤博文", "m": "内閣制度をつくり初代首相となった人物", "q": "1885年に内閣制度をつくり、初代内閣総理大臣となった人物はだれか。"}, {"t": "大日本帝国憲法の発布", "ax": "pol", "y": 1889, "d": "天皇が定める形で発布。主権は天皇にあり、国民は法律の範囲で権利が認められた。", "w": "大日本帝国憲法", "m": "天皇が主権をもつと定めた憲法", "q": "1889年に発布された、主権が天皇にあると定めた憲法を何というか。", "cf": [{"t": "日本国憲法", "m": "戦後に定められた国民主権の憲法"}]}, {"t": "第1回帝国議会", "ax": "pol", "y": 1890, "d": "選挙で選ばれた衆議院と貴族院からなる議会が開かれ、立憲国家のしくみが動き出した。", "w": "帝国議会", "m": "衆議院と貴族院からなる議会", "q": "1890年に初めて開かれた、衆議院と貴族院からなる議会を何というか。"}, {"t": "岩倉使節団の派遣", "ax": "war", "y": 1871, "d": "岩倉具視を中心に、条約改正の交渉と欧米の視察のため使節団を送った。改正には失敗した。", "w": "岩倉使節団", "m": "条約改正と欧米視察のため送られた使節団", "q": "1871年、条約改正の交渉と欧米視察のために送られた、岩倉具視を中心とする一行を何というか。"}, {"t": "西南戦争", "ax": "war", "y": 1877, "d": "政府に不満をもつ士族が西郷隆盛をおして起こした最大の反乱。政府軍がしずめた。", "w": "西南戦争", "m": "西郷隆盛をおして士族が起こした反乱", "q": "1877年、政府に不満をもつ士族が西郷隆盛をおして起こした最大の反乱を何というか。"}, {"t": "領事裁判権の撤廃（陸奥宗光）", "ax": "war", "y": 1894, "d": "日清戦争の直前、イギリスとの交渉で領事裁判権（治外法権）をなくすことに成功した。", "w": "陸奥宗光", "m": "領事裁判権の撤廃に成功した外務大臣", "q": "日清戦争の直前、イギリスとの交渉で領事裁判権の撤廃に成功した外務大臣はだれか。", "cf": [{"t": "小村寿太郎", "m": "関税自主権の回復に成功した外務大臣"}]}, {"t": "日清戦争", "ax": "war", "y": 1894, "d": "朝鮮をめぐって清と戦い、日本が勝利した。", "w": "日清戦争", "m": "朝鮮をめぐり日本が清と戦った戦争", "q": "1894年、朝鮮をめぐって起こり、日本が清に勝利した戦争を何というか。", "cf": [{"t": "日露戦争", "m": "1904年に起きたロシアとの戦争"}]}, {"t": "下関条約・三国干渉", "ax": "war", "y": 1895, "d": "清から賠償金と台湾などを得たが、ロシアなど三国の干渉で遼東半島は返還した。", "w": "下関条約", "m": "日清戦争の講和条約", "q": "日清戦争の講和として結ばれ、日本が賠償金や台湾を得た条約を何というか。", "cf": [{"t": "ポーツマス条約", "m": "日露戦争の講和条約"}, {"t": "三国干渉", "m": "ロシアなどが遼東半島の返還を求めたこと"}]}, {"t": "日露戦争", "ax": "war", "y": 1904, "d": "満州・韓国をめぐってロシアと戦う。多くの犠牲を出しながら優勢に進めた。", "w": "日露戦争", "m": "満州・韓国をめぐるロシアとの戦争", "q": "1904年、満州や韓国をめぐって起こった、日本とロシアの戦争を何というか。", "cf": [{"t": "日清戦争", "m": "1894年に起きた清との戦争"}]}, {"t": "ポーツマス条約", "ax": "war", "y": 1905, "d": "アメリカの仲立ちで講和。韓国での優先権や樺太の南半分などを得たが、賠償金はなかった。", "w": "ポーツマス条約", "m": "日露戦争の講和条約", "q": "アメリカの仲立ちで結ばれた、日露戦争の講和条約を何というか。", "cf": [{"t": "下関条約", "m": "日清戦争の講和条約"}]}, {"t": "韓国併合", "ax": "war", "y": 1910, "d": "日本が韓国を植民地として支配下に置いた。", "w": "韓国併合", "m": "日本が韓国を植民地にしたこと", "q": "1910年、日本が韓国を植民地として支配下に置いたできごとを何というか。"}, {"t": "関税自主権の回復（小村寿太郎）", "ax": "war", "y": 1911, "d": "関税を自分で決める権利を取りもどし、条約改正が達成された。", "w": "小村寿太郎", "m": "関税自主権の回復に成功した外務大臣", "q": "1911年、関税自主権を回復し条約改正を達成した外務大臣はだれか。", "cf": [{"t": "陸奥宗光", "m": "領事裁判権の撤廃に成功した外務大臣"}]}, {"t": "殖産興業（富岡製糸場・鉄道）", "ax": "eco", "y": 1872, "d": "政府は官営の富岡製糸場を建て、新橋〜横浜に鉄道を通すなど、近代産業を育てた。", "w": "殖産興業", "m": "政府が近代産業を育てた政策", "q": "明治政府が富岡製糸場や鉄道をつくり、近代産業を育てようとした政策を何というか。", "cf": [{"t": "富岡製糸場", "m": "群馬県につくられた官営の製糸工場"}]}, {"t": "地租改正", "ax": "eco", "y": 1873, "d": "土地の価格を基準に、現金で税を納めさせる。政府の財政が安定した。", "w": "地租改正", "m": "地価を基準に現金で税を納めさせた改革", "q": "土地の価格を基準に、現金で税を納めさせた明治政府の改革を何というか。", "cf": [{"t": "太閤検地", "m": "豊臣秀吉が全国の田畑を調べた政策"}]}, {"t": "官営工場の払い下げ", "ax": "eco", "y": 1885, "d": "政府は官営工場を民間に安く売り、のちの財閥の成長につながった。", "w": "官営工場の払い下げ", "m": "政府が官営工場を民間に安く売ったこと", "q": "政府が官営の工場を民間に安く売り、のちの財閥の成長につながったことを何というか。", "cf": [{"t": "財閥", "m": "多くの企業を支配した大資本家の集まり"}]}, {"t": "足尾銅山鉱毒事件", "ax": "eco", "y": 1900, "d": "銅山の鉱毒で川や田畑が汚染され、田中正造が被害を政府にうったえた。", "w": "足尾銅山鉱毒事件", "m": "銅山の鉱毒による日本初の公害事件", "q": "田中正造が被害を政府に訴えた、銅山の鉱毒による公害事件を何というか。", "cf": [{"t": "田中正造", "m": "足尾銅山鉱毒事件の解決に取り組んだ政治家"}]}, {"t": "産業革命（製糸・紡績）", "ax": "eco", "y": 1897, "d": "日清戦争のころ、製糸・紡績などの軽工業を中心に産業革命が進んだ。", "w": "産業革命", "m": "軽工業を中心に進んだ機械生産の広まり", "q": "日清戦争のころ、日本で製糸・紡績などの軽工業を中心に進んだ機械生産の広がりを何というか。"}, {"t": "八幡製鉄所（重工業）", "ax": "eco", "y": 1901, "d": "日清戦争の賠償金の一部でつくられた官営の製鉄所。重工業の発展を支えた。", "w": "八幡製鉄所", "m": "日清戦争の賠償金でつくられた官営製鉄所", "q": "日清戦争の賠償金の一部でつくられ、重工業を支えた官営の製鉄所を何というか。"}, {"t": "学制（教育制度）", "ax": "cul", "y": 1872, "d": "6歳以上の子どもすべてに教育を受けさせる方針が示され、各地に小学校がつくられた。", "w": "学制", "m": "6歳以上の子に教育を受けさせる方針", "q": "1872年に出された、6歳以上の子どもすべてに教育を受けさせる方針を何というか。", "cf": [{"t": "徴兵令", "m": "満20歳以上の男子に兵役を課した法令"}]}, {"t": "福沢諭吉『学問のすゝめ』", "ax": "cul", "y": 1873, "d": "「天は人の上に人をつくらず」と説き、学問や人間の平等の大切さを広めた。", "w": "福沢諭吉", "m": "『学問のすゝめ』で学問の大切さを説いた人", "q": "「天は人の上に人をつくらず」と説き、『学問のすゝめ』を著した人物はだれか。"}, {"t": "文明開化", "ax": "cul", "y": 1874, "d": "洋服・ざんぎり頭・れんが造りの街・ガス灯・太陽暦など、欧米風の生活が都市に広がった。", "w": "文明開化", "m": "欧米風の生活が都市に広がったこと", "q": "洋服やガス灯、太陽暦など、欧米風の生活が都市に広がったことを何というか。"}, {"t": "北里柴三郎（伝染病の研究）", "ax": "cul", "y": 1890, "d": "破傷風の治療法を発見するなど、世界的な医学の研究が生まれた。", "w": "北里柴三郎", "m": "破傷風の治療法を発見した医学者", "q": "破傷風の治療法を発見するなど、世界的な研究を行った医学者はだれか。"}, {"t": "黒田清輝（洋画）", "ax": "cul", "y": 1897, "d": "「湖畔」などで知られ、明るい色調の西洋画（洋画）を広めた。", "w": "黒田清輝", "m": "「湖畔」で知られる洋画家", "q": "「湖畔」などで知られ、明るい色調の西洋画を広めた画家はだれか。"}, {"t": "滝廉太郎（音楽）", "ax": "cul", "y": 1901, "d": "「荒城の月」「花」など、西洋の音楽をもとにした作品を残した。", "w": "滝廉太郎", "m": "「荒城の月」などを作曲した音楽家", "q": "「荒城の月」や「花」などを作曲した音楽家はだれか。"}, {"t": "近代文学（夏目漱石・森鴎外）", "ax": "cul", "y": 1906, "d": "夏目漱石や森鴎外、樋口一葉らが、近代的な小説を書いた。", "w": "夏目漱石", "m": "『坊っちゃん』などを書いた近代小説の作家", "q": "『坊っちゃん』『吾輩は猫である』などを書いた、明治の近代文学を代表する作家はだれか。", "cf": [{"t": "森鴎外", "m": "『舞姫』などを書いた明治の小説家"}]}, {"t": "ドイツの統一（ビスマルク）", "ax": "wld", "y": 1871, "d": "プロイセンがドイツを統一。日本の憲法づくりの手本にもなった。", "w": "ビスマルク", "m": "プロイセン中心にドイツを統一した政治家", "q": "プロイセンを中心にドイツを統一し、日本の憲法の手本ともなった国を率いた政治家はだれか。"}, {"t": "帝国主義の時代", "ax": "wld", "y": 1880, "d": "欧米列強が、資源や市場を求めてアジア・アフリカを植民地にしていった。", "w": "帝国主義", "m": "列強が植民地を広げていった動き", "q": "19世紀後半、欧米列強が資源や市場を求めて植民地を広げた動きを何というか。"}, {"t": "義和団事件（中国）", "ax": "wld", "y": 1900, "d": "外国の勢力に反発する動きを、列強が共同でしずめた。", ": "政党が解散して一つにまとめられ、国民を戦争に協力させる体制が固められた。", "w": "大政翼賛会", "m": "政党を一つにまとめた戦争協力の組織", "q": "1940年、政党が解散して一つにまとめられ、国民を戦争に協力させた組織を何というか。"}, {"t": "満州事変", "ax": "war", "y": 1931, "d": "関東軍が南満州鉄道の爆破（柳条湖事件）をきっかけに軍事行動を起こし、満州の大部分を占領した。", "w": "満州事変", "m": "柳条湖事件をきっかけに満州を占領した出来事", "q": "1931年、柳条湖事件をきっかけに関東軍が満州の大部分を占領した出来事を何というか。", "cf": [{"t": "日中戦争", "m": "1937年に始まった日本と中国の全面戦争"}]}, {"t": "満州国の建国", "ax": "war", "y": 1932, "d": "日本は満州国をつくり、事実上支配した。清の最後の皇帝溥儀を元首にすえた。", "w": "満州国", "m": "日本が満州につくり支配した国", "q": "1932年、日本が満州につくって事実上支配し、溥儀を元首にすえた国を何というか。"}, {"t": "国際連盟からの脱退", "ax": "war", "y": 1933, "d": "国際連盟が満州国を認めず引きあげを求めると、日本は連盟を脱退し、国際的に孤立していった。", "w": "国際連盟", "m": "日本が1933年に脱退した国際平和組織", "q": "満州国が認められず、1933年に日本が脱退した国際組織を何というか。", "cf": [{"t": "国際連合", "m": "第二次世界大戦後に発足した国際組織"}]}, {"t": "日中戦争", "ax": "war", "y": 1937, "d": "北京郊外の盧溝橋での衝突をきっかけに、日本と中国の全面戦争が始まり、長期化した。", "w": "日中戦争", "m": "盧溝橋事件から始まった日本と中国の全面戦争", "q": "1937年、盧溝橋での衝突をきっかけに始まった日本と中国の全面戦争を何というか。", "cf": [{"t": "満州事変", "m": "1931年、満州を占領した軍事行動"}]}, {"t": "第二次世界大戦の始まり", "ax": "wld", "y": 1939, "d": "ドイツがポーランドに侵攻し、ヨーロッパで第二次世界大戦が始まった。", "w": "第二次世界大戦", "m": "1939年に始まった世界的な戦争", "q": "1939年、ドイツのポーランド侵攻で始まった世界的な戦争を何というか。", "cf": [{"t": "第一次世界大戦", "m": "1914年に始まった世界的な戦争"}]}, {"t": "日独伊三国同盟", "ax": "war", "y": 1940, "d": "日本はドイツ・イタリアと同盟を結び、アメリカやイギリスとの対立を深めた。", "w": "日独伊三国同盟", "m": "日本・ドイツ・イタリアが結んだ軍事同盟", "q": "1940年、日本がドイツ・イタリアと結んだ同盟を何というか。"}, {"t": "太平洋戦争の始まり", "ax": "war", "y": 1941, "d": "日本軍がハワイの真珠湾を攻撃し、マレー半島に上陸。アメリカ・イギリスとの戦争が始まった。", "w": "太平洋戦争", "m": "真珠湾攻撃で始まった米英との戦争", "q": "1941年、日本軍の真珠湾攻撃などで始まったアメリカ・イギリスとの戦争を何というか。"}, {"t": "空襲・沖縄戦・原子爆弾", "ax": "war", "y": 1945, "d": "各地への空襲や沖縄戦で多くの命が失われ、広島・長崎に原子爆弾が投下された。", "w": "原子爆弾", "m": "1945年に広島・長崎へ投下された爆弾", "q": "1945年、広島・長崎に投下され多くの命を奪った爆弾を何というか。", "cf": [{"t": "沖縄戦", "m": "1945年、住民を巻きこんだ地上戦"}]}, {"t": "ポツダム宣言の受諾（終戦）", "ax": "war", "y": 1945, "d": "ポツダム宣言を受け入れて降伏し、15年におよぶ戦争が終わった。", "w": "ポツダム宣言", "m": "日本が受け入れて降伏した宣言", "q": "1945年、日本が受け入れて降伏した、連合国が無条件降伏を求めた宣言を何というか。"}, {"t": "金融恐慌", "a function periodLessons(pkey, terms){
  const byax={pol:[],war:[],eco:[],cul:[],wld:[]};
  terms.forEach(e=>{ if(byax[e.ax]) byax[e.ax].push(e); });
  const L=[];
  ['pol','war','eco','cul','wld'].forEach(ax=>{ if(byax[ax].length) L.push({id:pkey+'-'+ax, pkey, ax, name:AXN[ax], terms:byax[ax]}); });
  L.push({id:pkey+'-all', pkey, ax:'all', name:'総まとめ', terms:terms.slice()});
  return L;
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,exclude){ const pool=arr.filter(x=>x!==exclude); return shuffle(pool).slice(0,n); }

  const n=c.units.reduce((s,u)=>s+u.lessons.length,0);
  b.innerHTML='<span class="ce">'+c.emoji+'</span>'+c.name+'<span class="cs">'+(n?n+'レッスン':'準備中')+'</span>';
  b.onclick=()=>{ curCourse=k; curUnit=null; [...ctabs.children].forEach((x,i)=>x.setAttribute('aria-selected', CKEYS[i]===k?'true':'false')); renderCourse(); };
  ctabs.appendChild(b);
});
let curUnit=null;
const UNITCOLORS=['var(--pol)','var(--war)','var(--eco)','var(--cul)','var(--wld)'];
function renderCourse(){
  const c=COURSES[curCourse], host=$('#courseBody');
  if(!c.units.length){ host.innerHTML='<div class="soonbox"><b>このコースは準備中です</b><br>'+(curCourse==='chiri'?'範囲が決まりしだい追加します。':'近日追加します。')+'</div>'; return; }
  if(!curUnit || !c.units.some(u=>u.id===curUnit)) renderUnitIndex(c,host);
  else renderUnitLessons(c,host);
}
function unitDone(u){ return u.lessons.filter(l=>P.crowns[l.id]).length; }
function renderUnitIndex(c,host){
  let h='<div class="unitgrid">';
  c.units.forEach((u,i)=>{
    const total=u.lessons.length, done=unitDone(u);
    const all=u.lessons.find(l=>l.ax==='all'); const nterms=all?all.terms.length:0;
    const col=UNITCOLORS[i%UNITCOLORS.length];
    h+='<button class="ucard'+(done>=total?' cleared':'')+'" data-uid="'+u.id+'" style="border-left-color:'+col+'">'+
       '<div class="un">'+u.name+'</div>'+
       '<div class="umeta"><span>'+nterms+'語</span><span>👑 '+done+'/'+total+'</span></div>'+
       '<div class="ubar2"><i style="width:'+(total?done/total*100:0)+'%;background:'+col+'"></i></div>'+
       '</button>';
  });
  h+='</div>';
  host.innerHTML=h;
  host.querySelectorAll('.ucard').forEach(b=> b.onclick=()=>{ curUnit=b.dataset.uid; renderCourse(); window.scrollTo(0,0); });
}
function renderUnitLessons(c,host){
  const u=c.units.find(x=>x.id===curUnit);
  const total=u.lessons.length, done=unitDone(u);
  let h='<button class="backbtn" id="toUnits">◀ 時代一覧へ</button>';
  h+='<div class="unit"><div class="uh"><span class="un">'+u.name+'</span><span class="up">'+done+' / '+total+' 達成</span></div>';
  h+='<div class="ubar"><i style="width:'+(total?done/total*100:0)+'%"></i></div>';
  h+='<div class="path">';
  u.lessons.forEach((l,i)=>{
    const crown=P.crowns[l.id];
    const cur=!crown && (i===0 || P.crowns[u.lessons[i-1].id]);
    h+='<div class="node '+(crown?'done':'')+' '+(cur?'cur':'')+'" data-lid="'+l.id+'">'+
       (crown?'<span class="crown">👑</span>':'')+
       '<div class="ring" style="background:'+AXCOLOR[l.ax]+';color:#fff">'+AXICON[l.ax]+'</div>'+
       '<div class="lbl">'+l.name+'</div></div>';
    if(i<u.lessons.length-1) h+='<div class="connector"></div>';
  });
  h+='</div></div>';
  host.innerHTML=h;
  $('#toUnits').onclick=()=>{ curUnit=null; renderCourse(); window.scrollTo(0,0); };
  host.querySelectorAll('.node').forEach(n=> n.onclick=()=>startLesson(n.dataset.lid));
}

/* ====== LESSON engine ====== */
let LS=null;
function findLesson(lid){
  for(const ck of CKEYS) for(const u of COURSES[ck].units) for(const l of u.lessons) if(l.id===lid) return l;
  return null;
}
function buildQuestions(lesson){
  const periodTerms = RAW_REKISHI[lesson.pkey] || lesson.terms;
  let terms=shuffle(lesson.terms);
  if(terms.length>10) terms=terms.slice(0,10);   // 1レッスン最大10語（×2方向=最大20問）
  const distractPool = lesson.terms.length>=5 ? lesson.terms : periodTerms;
  const qs=[];
  terms.forEach(t=>{ qs.push(makeQ(t,'toMean',distractPool)); qs.push(makeQ(t,'toTerm',distractPool)); });
  return shuffle(qs);
}
function makeDistractors(term,dir,distractPool){
  // key = 選択肢に出す文字列（dir=toMeanなら意味、toTermなら短い用語）
  const key = dir==='toMean' ? (x=>x.m) : (x=> x.w || x.t);
  const answer = key(term);
  const out=[];
  // まず「紛らわしい用語」を最大2つ混ぜる
  const cf=shuffle((term.cf||[]).slice()).slice(0,2);
  cf.forEach(c=>{ const v=key(c); if(v && v!==answer && !out.includes(v)) out.push(v); });
  // 残りを同じ範囲の用語からうめる
  sample(distractPool, distractPool.length, term).forEach(x=>{
    if(out.length>=3) return;
    const v=key(x);
    if(v && v!==answer && !out.includes(v)) out.push(v);
  });
  return out.slice(0,3);
}
function makeQ(term,dir,distractPool){
  const wrong=makeDistractors(term,dir,distractPool);
  const W=term.w||term.t;
  if(dir==='toMean'){
    const opts=shuffle([{txt:term.m,ok:true}].concat(wrong.map(w=>({txt:w,ok:false}))));
    return {kind:'用語 → 意味', promptCls:'term', prompt:W, opts, term, dir:'toMean'};
  }else{
    const opts=shuffle([{txt:W,ok:true}].concat(wrong.map(w=>({txt:w,ok:false}))));
    return {kind:'意味 → 用語', promptCls:'mean', prompt:(term.q||term.m), opts, term, dir:'toTerm'};
  }
}
function startLesson(lid){
  const lesson=findLesson(lid); if(!lesson) return;
  LS={ lesson, queue:buildQuestions(lesson), idx:0, total:0, hearts:5, firstTry:0, answered:0, xp:0, streak:0, maxStreak:0, locked:false };
  LS.total=LS.queue.length;
  $('#homeScreen').classList.add('hidden');
  $('#resultScreen').classList.add('hidden');
  $('#lessonScreen').classList.remove('hidden');
  $('#lHeart').textContent=LS.hearts;
  renderQ();
}
function renderQ(){
  const q=LS.queue[LS.idx];
  LS.locked=false;
  $('#pfill').style.width=(LS.answered/LS.total*100)+'%';
  const wrap=$('#qwrap');
  wrap.innerHTML='<div class="qkind">'+q.kind+'</div>'+
    '<div class="qprompt '+q.promptCls+'">'+q.prompt+'</div>'+
    '<div class="qhint">'+(q.promptCls==='term'?'意味としてあてはまるものをえらぼう':'あてはまる用語をえらぼう')+'</div>'+
    '<div class="choices" id="choices"></div>';
  const ch=$('#choices');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=o.txt;
    b.onclick=()=>pick(b,o,q);
    ch.appendChild(b);
  });
  wrap.scrollTop=0;
}
function pick(btn,opt,q){
  if(LS.locked) return; LS.locked=true;
  const all=[...document.querySelectorAll('.choice')];
  all.forEach(b=>b.classList.add('disabled'));
  if(opt.ok){
    btn.classList.add('correct');
    LS.xp+=10; LS.firstTry++; LS.streak++; LS.maxStreak=Math.max(LS.maxStreak,LS.streak);
    feedback(true,q);
  }else{
    btn.classList.add('wrong');
    all.forEach(b=>{ if(b.textContent=== (q.opts.find(o=>o.ok).txt)) b.classList.add('correct'); });
    LS.hearts--; LS.streak=0;
    $('#lHeart').textContent=Math.max(0,LS.hearts);
    LS.queue.push(makeQ(q.term, q.dir, LS.lesson.terms.length>=5?LS.lesson.terms:(RAW_REKISHI[LS.lesson.pkey]||LS.lesson.terms))); LS.total++;
    feedback(false,q);
  }
}
function feedback(ok,q){
  const sh=$('#sheet');
  sh.className='sheet show '+(ok?'ok':'bad');
  $('#fh').innerHTML=(ok?'⭕ 正解！':'❌ おしい！');
  $('#fans').innerHTML='<b>'+(q.term.w||q.term.t)+'</b>（'+q.term.y+'年）<br>'+q.term.d;
  $('#contBtn').onclick=()=>{
    sh.classList.remove('show');
    LS.answered++;
    if(LS.hearts<=0){ return endLesson(false); }
    LS.idx++;
    if(LS.idx>=LS.queue.length){ return endLesson(true); }
    renderQ();
  };
}
function endLesson(cleared){
  const acc=Math.round(LS.firstTry/Math.max(1,LS.total)*100);
  // commit progress
  P.xp+=LS.xp;
  P.bestStreak=Math.max(P.bestStreak||0, LS.maxStreak);
  const prevCrown=P.crowns[LS.lesson.id];
  let leveledTo=null;
  const beforeLv=levelOf(P.xp-LS.xp), afterLv=levelOf(P.xp);
  if(afterLv>beforeLv) leveledTo=afterLv;
  if(cleared && acc>=80) P.crowns[LS.lesson.id]=true;
  // daily streak
  const today=new Date().toISOString().slice(0,10);
  if(P.lastDay!==today){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    P.dayStreak = (P.lastDay===y)?(P.dayStreak||0)+1 : 1;
    P.lastDay=today;
  }
  save(); renderStatus();
  const sc=$('#resultScreen');
  $('#lessonScreen').classList.add('hidden');
  sc.classList.remove('hidden');
  const emoji = !cleared ? '💧' : acc>=80 ? '🎉' : '👍';
  const head = !cleared ? 'ハートがなくなった…' : acc>=80 ? 'クリア！' : 'おつかれさま';
  sc.innerHTML='<div class="result">'+
    '<div class="big">'+emoji+'</div><h2>'+head+'</h2>'+
    '<div class="rsub">'+LS.lesson.name+'</div>'+
    '<div class="rstats">'+
      '<div class="rstat xp"><div class="rv">+'+LS.xp+'</div><div class="rl">獲得XP</div></div>'+
      '<div class="rstat acc"><div class="rv">'+acc+'%</div><div class="rl">一発正解率</div></div>'+
      '<div class="rstat streak"><div class="rv">'+LS.maxStreak+'</div><div class="rl">連続正解</div></div>'+
    '</div>'+
    (leveledTo?'<div class="levelup">🆙 レベル '+leveledTo+' にアップ！</div>':'')+
    ((cleared&&acc>=80&&!prevCrown)?'<div class="levelup" style="background:var(--eco)">👑 このレッスンに王冠を獲得！</div>':'')+
    '<div class="rbtns">'+
      '<button class="rbtn primary" id="againBtn">もう一度</button>'+
      '<button class="rbtn ghost" id="homeBtn">マップへもどる</button>'+
    '</div></div>';
  $('#againBtn').onclick=()=>startLesson(LS.lesson.id);
  $('#homeBtn').onclick=()=>goHome();
}
function goHome(){
  $('#lessonScreen').classList.add('hidden');
  $('#resultScreen').classList.add('hidden');
  $('#homeScreen').classList.remove('hidden');
  renderCourse(); renderStatus();
}
function showQuitBar(v){ $('#quitbar').classList.toggle('show',v); $('#qbackdrop').classList.toggle('show',v); }
$('#quitBtn').onclick=()=>showQuitBar(true);
$('#quitCancel').onclick=()=>showQuitBar(false);
$('#qbackdrop').onclick=()=>showQuitBar(false);
$('#quitOk').onclick=()=>{ showQuitBar(false); $('#sheet').classList.remove('show'); curUnit=null; goHome(); };

/* ====== init ====== */
renderStatus(); renderCourse();
</script>
